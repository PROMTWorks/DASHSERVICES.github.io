<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASH Services | Secure Admin</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#111827}
#loading{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;text-align:center;padding:20px}
iframe{display:none;width:100%;height:100%;border:0;background:#f3f5f8}
</style>
</head>
<body>
<div id="loading">Checking DASH Services administrator access…</div>
<iframe id="adminFrame" title="DASH Services Admin Portal" src="admin-v2.html"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.DASH_ADMIN_SUPABASE = window.DASH_ADMIN_SUPABASE || window.supabase.createClient('https://roywoofgypiyoobdcrwx.supabase.co','sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const dashLoading=document.getElementById('loading');
const dashFrame=document.getElementById('adminFrame');
(async()=>{
 try{
  const {data:{session}}=await window.DASH_ADMIN_SUPABASE.auth.getSession();
  if(!session){window.location.replace('admin-login.html');return;}
  dashLoading.style.display='none';dashFrame.style.display='block';
 }catch(e){dashLoading.textContent='Unable to verify administrator access. Please sign in again.';}
})();
window.DASH_ADMIN_SUPABASE.auth.onAuthStateChange((_event,session)=>{if(!session)window.location.replace('admin-login.html');});
</script>
</body>
</html>
