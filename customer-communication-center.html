<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DASH | Customer Communication Center</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f8;color:#17202a}.top{background:#111827;color:#fff;padding:20px 28px;display:flex;justify-content:space-between}.brand{font-weight:800;letter-spacing:2px}.wrap{max-width:1350px;margin:auto;padding:28px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.btn{background:#111827;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid #e1e6eb;border-radius:12px}.card{padding:17px}.label{font-size:11px;font-weight:800;color:#64748b}.value{font-size:25px;font-weight:800;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{margin-bottom:18px;overflow:hidden}.head{padding:16px 18px;border-bottom:1px solid #e1e6eb;font-weight:800}.body{padding:18px}.item{padding:13px 0;border-bottom:1px solid #e8edf2}.item:last-child{border-bottom:0}.muted{color:#64748b;font-size:13px}.pill{display:inline-block;background:#eef2f7;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700}.good{background:#ecfdf5;color:#166534}.warn{background:#fff7ed;color:#9a3412}.empty{text-align:center;padding:25px;color:#64748b}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.cards{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column;gap:10px}}</style></head><body><header class="top"><div class="brand">DASH MOBILE SERVICES</div><div>COMMUNICATION CENTER</div></header><main class="wrap"><div class="bar"><div><h1>Customer Communication Center</h1><div class="muted">Track confirmations, reminders, payment notices and review requests.</div></div><button class="btn" onclick="location.href='admin-production.html'">← Admin Portal</button></div><div class="cards"><div class="card"><div class="label">QUEUED</div><div class="value" id="queued">—</div></div><div class="card"><div class="label">SENT</div><div class="value" id="sent">—</div></div><div class="card"><div class="label">FAILED</div><div class="value" id="failed">—</div></div><div class="card"><div class="label">REVIEWS</div><div class="value" id="reviews">—</div></div></div><div class="grid"><section class="panel"><div class="head">Communication Queue</div><div class="body" id="queue"><div class="empty">Loading…</div></div></section><section class="panel"><div class="head">Message Types</div><div class="body" id="types"><div class="empty">Loading…</div></div></section><section class="panel"><div class="head">Customer Preferences</div><div class="body" id="prefs"><div class="empty">Loading…</div></div></section><section class="panel"><div class="head">Review Requests & Results</div><div class="body" id="reviewList"><div class="empty">Loading…</div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://roywoofgypiyoobdcrwx.supabase.co','sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_');const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const [m,p,r]=await Promise.all([db.from('customer_communications').select('*').order('created_at',{ascending:false}).limit(100),db.from('customer_communication_preferences').select('*'),db.from('customer_reviews').select('*').order('created_at',{ascending:false}).limit(50)]);const msgs=m.data||[],prefs=p.data||[],reviews=r.data||[];$('queued').textContent=msgs.filter(x=>x.status==='queued').length;$('sent').textContent=msgs.filter(x=>x.status==='sent').length;$('failed').textContent=msgs.filter(x=>x.status==='failed').length;$('reviews').textContent=reviews.length;renderQueue(msgs);renderTypes(msgs);renderPrefs(prefs);renderReviews(reviews)}function renderQueue(a){$('queue').innerHTML=a.length?a.slice(0,20).map(x=>`<div class="item"><b>${esc(x.message_type)}</b><div class="muted">${esc(x.channel)} · ${esc(x.recipient||'Recipient not set')} · ${new Date(x.created_at).toLocaleString()}</div><span class="pill ${x.status==='sent'?'good':x.status==='failed'?'warn':''}">${esc(x.status)}</span></div>`).join(''):'<div class="empty">No customer communications recorded.</div>'}function renderTypes(a){const map={};a.forEach(x=>map[x.message_type]=(map[x.message_type]||0)+1);$('types').innerHTML=Object.keys(map).length?Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><b>${esc(k)}</b><div class="muted">${v} message${v===1?'':'s'}</div></div>`).join(''):'<div class="empty">No message activity yet.</div>'}function renderPrefs(a){$('prefs').innerHTML=`<div class="item"><b>Customers with saved preferences</b><div class="muted">${a.length}</div></div><div class="item"><b>Appointment reminders enabled</b><div class="muted">${a.filter(x=>x.appointment_reminders).length}</div></div><div class="item"><b>Payment reminders enabled</b><div class="muted">${a.filter(x=>x.payment_reminders).length}</div></div><div class="item"><b>Review requests enabled</b><div class="muted">${a.filter(x=>x.review_requests).length}</div></div>`}function renderReviews(a){$('reviewList').innerHTML=a.length?a.map(x=>`<div class="item"><b>${x.rating?esc(x.rating)+'/5':'Pending review'}</b><div class="muted">${x.requested_at?'Requested '+new Date(x.requested_at).toLocaleDateString():''}${x.received_at?' · Received '+new Date(x.received_at).toLocaleDateString():''}</div>${x.review_text?`<div>${esc(x.review_text)}</div>`:''}</div>`).join(''):'<div class="empty">No review requests/results yet.</div>'}load();</script></body></html>
