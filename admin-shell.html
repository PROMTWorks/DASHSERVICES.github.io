<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DASH Services | Admin Portal</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f8;font-family:Arial,Helvetica,sans-serif}#status{height:100%;display:flex;align-items:center;justify-content:center;color:#475569;font-size:15px}iframe{display:none;width:100%;height:100%;border:0}#signOut{display:none;position:fixed;top:70px;right:18px;z-index:2147483647;border:1px solid #d1d5db;border-radius:8px;padding:9px 14px;background:#fff;color:#111827;font:700 13px Arial,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.12)}</style>
</head><body>
<div id="status">Verifying your secure Supabase session…</div><button id="signOut" type="button">Sign Out</button><iframe id="portal" title="DASH Services Admin Portal"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://roywoofgypiyoobdcrwx.supabase.co',SUPABASE_PUBLISHABLE_KEY='sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_',client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),status=document.getElementById('status'),frame=document.getElementById('portal'),signOut=document.getElementById('signOut');
const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const show=x=>x===null||x===undefined||String(x).trim()===''?'Not recorded':esc(x);
async function refreshBookings(){try{const session=(await client.auth.getSession()).data.session;if(!session||!frame.contentDocument)return;const r=await fetch(SUPABASE_URL+'/functions/v1/dash-admin-bookings',{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_PUBLISHABLE_KEY},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load bookings.');const doc=frame.contentDocument,nav=[...doc.querySelectorAll('aside button')].find(b=>b.textContent.trim().replace(/\s*\(\d+\)$/,'')==='Bookings');if(nav)nav.textContent='Bookings ('+Number(d.count||0)+')';const list=doc.querySelector('#bookingList');if(list&&Array.isArray(d.bookings)){list.innerHTML=d.bookings.length?d.bookings.map((x,i)=>{const name=[x.first_name,x.last_name].filter(Boolean).join(' ');return `<div class="row"><div><strong>${show(x.request_number||x.client_request_number||'DASH Request')}</strong><span class="mini">${show(name)} · ${show(x.email)} · ${show(x.phone)}</span><span class="mini"><b>Service:</b> ${show(x.service_name||x.service_key)} · ${show([x.preferred_date,x.preferred_time].filter(Boolean).join(' '))}</span><span class="mini"><b>Vehicle Year:</b> ${show(x.vehicle_year)} · <b>Make:</b> ${show(x.vehicle_make)}</span><span class="mini"><b>Model:</b> ${show(x.vehicle_model)} · <b>Engine:</b> ${show(x.vehicle_engine)} · <b>Trim:</b> ${show(x.vehicle_trim)}</span><span class="mini">${show([x.city,x.state,x.postal_code].filter(Boolean).join(', '))}</span><span class="mini">${show(x.full_address)}</span></div><div class="toolbar"><span class="pill">${show(x.request_status||'submitted')}</span><span class="pill">Proof: ${show(x.proof_status||'not_required')}</span><button class="btn light" data-erase-index="${i}">Erase Booking</button></div></div>`}).join(''):'<div class="empty"><strong>No bookings yet</strong>No service requests have been submitted.</div>';list.querySelectorAll('[data-erase-index]').forEach(b=>b.onclick=async()=>{const x=d.bookings[Number(b.dataset.eraseIndex)],label=x.request_number||x.client_request_number||'this booking';if(!confirm('Are you sure you want to erase '+label+'? This cannot be undone.'))return;try{const s=(await client.auth.getSession()).data.session;if(!s)throw Error('Your session has expired.');const resp=await fetch(SUPABASE_URL+'/functions/v1/admin-delete-service-request',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({request_id:x.id})});const out=await resp.json().catch(()=>({}));if(!resp.ok)throw Error(out.error||out.message||'Could not erase booking.');await refreshBookings();}catch(e){alert('Could not erase booking: '+e.message)}});}}catch(e){console.warn('Booking refresh failed',e)}}
async function loadPortal(){const {data,error}=await client.auth.getUser();if(error||!data?.user){location.replace('admin-login.html');return}const {data:s}=await client.auth.getSession(),token=s?.session?.access_token;if(!token){location.replace('admin-login.html');return}const response=await fetch(SUPABASE_URL+'/functions/v1/dash-admin-portal',{headers:{Authorization:'Bearer '+token}});if(!response.ok)throw Error('Protected admin portal could not be loaded.');frame.srcdoc=await response.text();frame.addEventListener('load',()=>{status.style.display='none';frame.style.display='block';signOut.style.display='block';refreshBookings();setTimeout(refreshBookings,500);setTimeout(refreshBookings,1500)},{once:true})}signOut.onclick=async()=>{await client.auth.signOut();location.replace('admin-login.html')};loadPortal().catch(e=>status.textContent=e.message||'Unable to verify administrator access.');client.auth.onAuthStateChange((_e,s)=>{if(!s)location.replace('admin-login.html')});
</script></body></html>
