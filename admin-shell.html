<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DASH Services | Admin Portal</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f8;font-family:Arial,Helvetica,sans-serif}#status{height:100%;display:flex;align-items:center;justify-content:center;color:#475569;font-size:15px}iframe{display:none;width:100%;height:100%;border:0}#signOut{display:none;position:fixed;top:70px;right:18px;z-index:2147483647;border:1px solid #d1d5db;border-radius:8px;padding:9px 14px;background:#fff;color:#111827;font:700 13px Arial,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.12)}#signOut:hover{background:#f8fafc}#signOut:disabled{opacity:.6;cursor:not-allowed}</style>
</head>
<body>
<div id="status">Verifying your secure Supabase session…</div>
<button id="signOut" type="button">Sign Out</button>
<iframe id="portal" title="DASH Services Admin Portal"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://roywoofgypiyoobdcrwx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const status=document.getElementById('status');
const frame=document.getElementById('portal');
const signOut=document.getElementById('signOut');
function wireTopLevelNavigation(){
  try{
    const doc=frame.contentDocument;
    if(!doc)return;
    doc.addEventListener('click',event=>{
      const el=event.target?.closest?.('button,a');
      if(!el)return;
      const text=(el.textContent||'').trim().toLowerCase();
      const href=(el.getAttribute('href')||'').toLowerCase();
      if(text==='communications'||href.includes('admin-communications.html')){
        event.preventDefault();
        event.stopPropagation();
        window.location.assign('admin-communications.html');
      }
    },true);
    [...doc.querySelectorAll('button')].forEach(btn=>{
      if((btn.textContent||'').trim().toLowerCase()==='communications'){
        btn.onclick=event=>{
          event.preventDefault();
          window.location.assign('admin-communications.html');
        };
      }
    });
  }catch(e){console.warn('Unable to wire admin navigation',e)}
}
async function loadPortal(){
  const {data,error}=await client.auth.getUser();
  if(error||!data?.user){window.location.replace('admin-login.html');return;}
  const {data:sessionData}=await client.auth.getSession();
  const token=sessionData?.session?.access_token;
  if(!token){window.location.replace('admin-login.html');return;}
  const response=await fetch('https://roywoofgypiyoobdcrwx.supabase.co/functions/v1/dash-admin-portal',{headers:{Authorization:'Bearer '+token}});
  if(!response.ok)throw new Error('Protected admin portal could not be loaded.');
  frame.srcdoc=await response.text();
  frame.addEventListener('load',wireTopLevelNavigation,{once:true});
  status.style.display='none';
  frame.style.display='block';
  signOut.style.display='block';
}
signOut.addEventListener('click',async()=>{
  signOut.disabled=true;
  signOut.textContent='Signing Out…';
  const {error}=await client.auth.signOut();
  if(error){signOut.disabled=false;signOut.textContent='Sign Out';return;}
  window.location.replace('admin-login.html');
});
loadPortal().catch(error=>{status.textContent=error?.message||'Unable to verify administrator access.'});
client.auth.onAuthStateChange((_event,session)=>{if(!session)window.location.replace('admin-login.html')});
</script>
</body>
</html>
