<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DASH Services | Admin Portal</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f8;font-family:Arial,Helvetica,sans-serif}#status{height:100%;display:flex;align-items:center;justify-content:center;color:#475569;font-size:15px}iframe{display:none;width:100%;height:100%;border:0}#signOut{display:none;position:fixed;top:70px;right:18px;z-index:2147483647;border:1px solid #d1d5db;border-radius:8px;padding:9px 14px;background:#fff;color:#111827;font:700 13px Arial,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.12)}#bookingDetail{display:none;position:fixed;inset:0;z-index:2147483646;background:rgba(15,23,42,.58);align-items:center;justify-content:center;padding:20px;font-family:Arial,Helvetica,sans-serif}#bookingDetail.show{display:flex}.bd-box{width:min(820px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.bd-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.bd-head h2{margin:0;color:#111827}.bd-close{border:1px solid #d7dde5;background:#fff;border-radius:7px;padding:8px 12px;font-weight:700;cursor:pointer}.bd-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bd-item{border:1px solid #e2e7ed;border-radius:9px;padding:12px}.bd-label{font-size:11px;color:#64748b;font-weight:800;text-transform:uppercase;letter-spacing:.4px}.bd-value{margin-top:5px;font-size:15px;color:#17202a;font-weight:600}.bd-section{grid-column:1/-1;font-size:16px;font-weight:800;margin-top:8px;color:#111827}.danger{border:1px solid #fecaca!important;background:#fff1f2!important;color:#b91c1c!important}@media(max-width:600px){.bd-grid{grid-template-columns:1fr}}</style>
</head>
<body>
<div id="status">Verifying your secure Supabase session…</div><button id="signOut" type="button">Sign Out</button><iframe id="portal" title="DASH Services Admin Portal"></iframe>
<div id="bookingDetail"><div class="bd-box"><div class="bd-head"><h2>Booking Details</h2><button class="bd-close" id="bdClose">Close</button></div><div id="bdContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://roywoofgypiyoobdcrwx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const status=document.getElementById('status'),frame=document.getElementById('portal'),signOut=document.getElementById('signOut'),detail=document.getElementById('bookingDetail'),detailContent=document.getElementById('bdContent');
const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const val=x=>x===null||x===undefined||String(x).trim()===''?'Not recorded':esc(x);
function showBooking(x){const vehicle=[x.vehicle_year,x.vehicle_make,x.vehicle_model,x.vehicle_trim].filter(v=>v!==null&&v!==undefined&&String(v).trim()!=='').join(' ');detailContent.innerHTML=`<div class="bd-grid"><div class="bd-section">Booking</div><div class="bd-item"><div class="bd-label">Booking Number</div><div class="bd-value">${val(x.request_number||x.client_request_number)}</div></div><div class="bd-item"><div class="bd-label">Service</div><div class="bd-value">${val(x.service_name||x.service_key)}</div></div><div class="bd-item"><div class="bd-label">Customer</div><div class="bd-value">${val([x.first_name,x.last_name].filter(Boolean).join(' '))}</div></div><div class="bd-item"><div class="bd-label">Phone</div><div class="bd-value">${val(x.phone)}</div></div><div class="bd-item"><div class="bd-label">Email</div><div class="bd-value">${val(x.email)}</div></div><div class="bd-item"><div class="bd-label">Preferred Date</div><div class="bd-value">${val(x.preferred_date)}</div></div><div class="bd-item"><div class="bd-label">Preferred Time</div><div class="bd-value">${val(x.preferred_time)}</div></div><div class="bd-item"><div class="bd-label">Status</div><div class="bd-value">${val(x.request_status)}</div></div><div class="bd-section">Vehicle Information</div><div class="bd-item"><div class="bd-label">Vehicle Year</div><div class="bd-value">${val(x.vehicle_year)}</div></div><div class="bd-item"><div class="bd-label">Vehicle Make</div><div class="bd-value">${val(x.vehicle_make)}</div></div><div class="bd-item"><div class="bd-label">Vehicle Model</div><div class="bd-value">${val(x.vehicle_model)}</div></div><div class="bd-item"><div class="bd-label">Engine</div><div class="bd-value">${val(x.vehicle_engine)}</div></div><div class="bd-item"><div class="bd-label">Trim</div><div class="bd-value">${val(x.vehicle_trim)}</div></div><div class="bd-item"><div class="bd-label">Complete Vehicle</div><div class="bd-value">${val(vehicle)}</div></div><div class="bd-section">Location</div><div class="bd-item" style="grid-column:1/-1"><div class="bd-label">Address</div><div class="bd-value">${val(x.full_address)}</div></div></div>`;detail.classList.add('show');}
document.getElementById('bdClose').onclick=()=>detail.classList.remove('show');detail.onclick=e=>{if(e.target===detail)detail.classList.remove('show')};
async function deleteBooking(x){if(!x?.id)return;const label=x.request_number||x.client_request_number||'this booking';if(!confirm(`Erase ${label}? This permanently removes the booking from the admin booking records.`))return;try{const {error}=await client.rpc('admin_delete_service_request',{p_request_id:x.id});if(error)throw error;detail.classList.remove('show');await refreshBookings();}catch(e){alert('Could not erase booking: '+(e.message||e));}}
async function refreshBookings(){try{const session=(await client.auth.getSession()).data.session;if(!session||!frame.contentDocument)return;const r=await fetch(SUPABASE_URL+'/functions/v1/dash-admin-bookings',{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_PUBLISHABLE_KEY},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load bookings.');const doc=frame.contentDocument;const nav=[...doc.querySelectorAll('aside button')].find(b=>b.textContent.trim().replace(/\s*\(\d+\)$/,'')==='Bookings');if(nav)nav.textContent='Bookings ('+Number(d.count||0)+')';const list=doc.querySelector('#bookingList');if(list&&Array.isArray(d.bookings)){list.innerHTML=d.bookings.length?d.bookings.map((x,i)=>{const name=[x.first_name,x.last_name].filter(Boolean).join(' '),vehicle=[x.vehicle_year,x.vehicle_make,x.vehicle_model,x.vehicle_trim].filter(Boolean).join(' ');return `<div class="row"><div><strong>${esc(x.request_number||x.client_request_number||'DASH Request')}</strong><span class="mini">${esc(name)} · ${esc(x.email||'—')} · ${esc(x.phone||'—')}</span><span class="mini"><b>Service:</b> ${esc(x.service_name||x.service_key||'Service')} · ${esc([x.preferred_date,x.preferred_time].filter(Boolean).join(' ')||'No preferred time')}</span>${vehicle?`<span class="mini"><b>Vehicle:</b> ${esc(vehicle)}</span>`:''}${x.vehicle_engine?`<span class="mini"><b>Engine:</b> ${esc(x.vehicle_engine)}</span>`:''}<span class="mini">${esc([x.city,x.state,x.postal_code].filter(Boolean).join(', '))}</span><span class="mini">${esc(x.full_address||'—')}</span></div><div class="toolbar"><span class="pill">${esc(x.request_status||'submitted')}</span><span class="pill">Proof: ${esc(x.proof_status||'not_required')}</span><button class="btn light" data-booking-index="${i}">View Booking</button><button class="btn light danger" data-delete-index="${i}">Erase Booking</button></div></div>`}).join(''):'<div class="empty"><strong>No bookings yet</strong>No service requests have been submitted.</div>';list.querySelectorAll('[data-booking-index]').forEach(b=>b.onclick=()=>showBooking(d.bookings[Number(b.dataset.bookingIndex)]));list.querySelectorAll('[data-delete-index]').forEach(b=>b.onclick=()=>deleteBooking(d.bookings[Number(b.dataset.deleteIndex)]));}}catch(e){console.warn('Booking refresh failed',e)}}
async function loadPortal(){const {data,error}=await client.auth.getUser();if(error||!data?.user){location.replace('admin-login.html');return}const {data:s}=await client.auth.getSession();const token=s?.session?.access_token;if(!token){location.replace('admin-login.html');return}const response=await fetch(SUPABASE_URL+'/functions/v1/dash-admin-portal',{headers:{Authorization:'Bearer '+token}});if(!response.ok)throw new Error('Protected admin portal could not be loaded.');frame.srcdoc=await response.text();frame.addEventListener('load',()=>{status.style.display='none';frame.style.display='block';signOut.style.display='block';refreshBookings();setTimeout(refreshBookings,500);setTimeout(refreshBookings,1500)},{once:true});}
signOut.onclick=async()=>{await client.auth.signOut();location.replace('admin-login.html')};loadPortal().catch(e=>status.textContent=e.message||'Unable to verify administrator access.');client.auth.onAuthStateChange((_e,s)=>{if(!s)location.replace('admin-login.html')});
</script></body></html>
