<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DASH Services | Admin Portal</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f8;font-family:Arial,Helvetica,sans-serif}#status{height:100%;display:flex;align-items:center;justify-content:center;color:#475569;font-size:15px}iframe{display:none;width:100%;height:100%;border:0}#signOut{display:none;position:fixed;top:70px;right:18px;z-index:2147483647;border:1px solid #d1d5db;border-radius:8px;padding:9px 14px;background:#fff;color:#111827;font:700 13px Arial,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.12)}</style></head><body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://roywoofgypiyoobdcrwx.supabase.co',SUPABASE_PUBLISHABLE_KEY='sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_',client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),status=document.getElementById('status'),frame=document.getElementById('portal'),signOut=document.getElementById('signOut');
const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const show=x=>x===null||x===undefined||String(x).trim()===''?'Not recorded':esc(x);
async function refreshBookings(){try{const session=(await client.auth.getSession()).data.session;if(!session||!frame.contentDocument)return;const r=await fetch(SUPABASE_URL+'/functions/v1/dash-admin-bookings',{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_PUBLISHABLE_KEY},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load bookings.');const doc=frame.contentDocument,nav=[...doc.querySelectorAll('aside button')].find(b=>b.textContent.trim().replace(/\s*\(\d+\)$/,'')==='Bookings');if(nav)nav.textContent='Bookings ('+Number(d.count||0)+')';const list=doc.querySelector('#bookingList');if(list&&Array.isArray(d.bookings)){list.innerHTML=d.bookings.length?d.bookings.map((x,i)=>{const name=[x.first_name,x.last_name].filter(Boolean).join(' ');return `<div class="row"><div><strong>${show(x.request_number||x.client_request_number||'DASH Request')}</strong><span class="mini">${show(name)} · ${show(x.email)} · ${show(x.phone)}</span><span class="mini"><b>Service:</b> ${show(x.service_name||x.service_key)} · ${show([x.preferred_date,x.preferred_time].filter(Boolean).join(' '))}</span><span class="mini"><b>Vehicle Year:</b> ${show(x.vehicle_year)} · <b>Make:</b> ${show(x.vehicle_make)}</span><span class="mini"><b>Model:</b> ${show(x.vehicle_model)} · <b>Engine:</b> ${show(x.vehicle_engine)} · <b>Trim:</b> ${show(x.vehicle_trim)}</span><span class="mini">${show([x.city,x.state,x.postal_code].filter(Boolean).join(', '))}</span><span class="mini">${show(x.full_address)}</span></div><div class="toolbar"><span class="pill">${show(x.request_status||'submitted')}</span><span class="pill">Proof: ${show(x.proof_status||'not_required')}</span><button class="btn light" data-erase-index="${i}">Erase Booking</button></div></div>`}).join(''):'<div class="empty"><strong>No bookings yet</strong>No service requests have been submitted.</div>';list.querySelectorAll('[data-erase-index]').forEach(b=>b.onclick=async()=>{const x=d.bookings[Number(b.dataset.eraseIndex)],label=x.request_number||x.client_request_number||'this booking';if(!confirm('Are you sure you want to erase '+label+'? This cannot be undone.'))return;try{const s=(await client.auth.getSession()).data.session;if(!s)throw Error('Your session has expired.');const resp=await fetch(SUPABASE_URL+'/functions/v1/admin-delete-service-request',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({request_id:x.id})});const out=await resp.json().catch(()=>({}));if(!resp.ok)throw Error(out.error||out.message||'Could not erase booking.');await refreshBookings();}catch(e){alert('Could not erase booking: '+e.message)}});}}catch(e){console.warn('Booking refresh failed',e)}}
async function employeeTools(){try{const doc=frame.contentDocument;if(!doc||!doc.getElementById('employees'))return;const section=doc.getElementById('employees'),body=section.querySelector('.body');if(!body||doc.getElementById('dashEmployeeTools'))return;const box=doc.createElement('div');box.id='dashEmployeeTools';box.className='panel';box.style.marginBottom='18px';box.innerHTML='<div class="head"><h2>Employee Login & Schedule</h2></div><div class="body"><div class="form-grid"><label>Employee<select id="etEmployee"></select></label><label>Login Email<input id="etEmail" type="email"></label><label>New Password<input id="etPassword" type="password" minlength="12" placeholder="At least 12 characters"></label><label>Schedule Day<select id="etDay"><option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select></label><label>Start Time<input id="etStart" type="time"></label><label>End Time<input id="etEnd" type="time"></label><label>Location<input id="etLocation"></label><label>Notes<input id="etNotes"></label></div><div class="toolbar" style="margin-top:14px"><button class="btn" id="etCreate">Create Employee Login</button><button class="btn light" id="etReset">Reset Password</button><button class="btn light" id="etSchedule">Save Schedule</button></div><div class="mini" id="etStatus" style="margin-top:10px"></div></div>';section.insertBefore(box,body);const session=(await client.auth.getSession()).data.session;const r=await fetch(SUPABASE_URL+'/functions/v1/dash-admin-portal',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'list'})}),j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load employees');const sel=box.querySelector('#etEmployee');(j.data||[]).filter(e=>String(e.employment_status).toLowerCase()==='active').forEach(e=>{const o=doc.createElement('option');o.value=e.employee_id;o.textContent=[e.first_name,e.last_name].filter(Boolean).join(' ')+' — '+e.employee_id;o.dataset.email=e.email||'';o.dataset.user=e.user_id||'';sel.appendChild(o)});const sync=()=>{const o=sel.selectedOptions[0];box.querySelector('#etEmail').value=o?.dataset.email||''};sel.onchange=sync;sync();const call=async(action,payload)=>{const s=(await client.auth.getSession()).data.session;const rr=await fetch(SUPABASE_URL+'/functions/v1/employee-account-admin',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({action,...payload})}),jj=await rr.json();if(!rr.ok)throw Error(jj.error||'Request failed');return jj};box.querySelector('#etCreate').onclick=async()=>{try{const id=sel.value,em=box.querySelector('#etEmail').value.trim(),pw=box.querySelector('#etPassword').value;if(!pw||pw.length<12)throw Error('Use a password with at least 12 characters.');await call('create_account',{employee_id:id,email:em,password:pw});box.querySelector('#etStatus').textContent='Employee login created successfully.'}catch(e){box.querySelector('#etStatus').textContent=e.message}};box.querySelector('#etReset').onclick=async()=>{try{const pw=box.querySelector('#etPassword').value;if(!pw||pw.length<12)throw Error('Use a password with at least 12 characters.');await call('set_password',{employee_id:sel.value,password:pw});box.querySelector('#etStatus').textContent='Employee password updated.'}catch(e){box.querySelector('#etStatus').textContent=e.message}};box.querySelector('#etSchedule').onclick=async()=>{try{await call('schedule',{employee_id:sel.value,day_of_week:Number(box.querySelector('#etDay').value),start_time:box.querySelector('#etStart').value,end_time:box.querySelector('#etEnd').value,location:box.querySelector('#etLocation').value,notes:box.querySelector('#etNotes').value});box.querySelector('#etStatus').textContent='Schedule saved. It will appear in the employee portal.'}catch(e){box.querySelector('#etStatus').textContent=e.message}}}catch(e){console.warn('Employee tools unavailable',e)}}
function addAttendanceNav(){try{const doc=frame.contentDocument;if(!doc)return;const aside=doc.querySelector('aside');if(!aside)return;if(!doc.getElementById('employeeTimeAttendanceNav')){const button=doc.createElement('button');button.id='employeeTimeAttendanceNav';button.className='nav-button';button.type='button';button.textContent='Employee Time & Attendance';button.onclick=()=>{window.top.location.href='employee-time-attendance.html'};aside.appendChild(button)}if(!doc.getElementById('employeePayrollHistoryNav')){const payroll=doc.createElement('button');payroll.id='employeePayrollHistoryNav';payroll.className='nav-button';payroll.type='button';payroll.textContent='Payroll History';payroll.onclick=()=>{window.top.location.href='employee-payroll-history.html'};aside.appendChild(payroll)}}catch(e){console.warn('Employee navigation unavailable',e)}}
async function addUhaulInterestNav(){try{const doc=frame.contentDocument;if(!doc)return;const aside=doc.querySelector('aside'),main=doc.querySelector('main');if(!aside||!main)return;if(!doc.getElementById('uhaulInterestNav')){const button=doc.createElement('button');button.id='uhaulInterestNav';button.className='nav-button';button.type='button';button.textContent='U-Haul Interest';button.onclick=()=>{[...doc.querySelectorAll('.section')].forEach(s=>s.classList.remove('active'));const sec=doc.getElementById('uhaul-interest');if(sec)sec.classList.add('active');[...doc.querySelectorAll('aside button')].forEach(b=>b.classList.remove('active'));button.classList.add('active');refreshUhaulInterest()};aside.appendChild(button)}if(!doc.getElementById('uhaul-interest')){const sec=doc.createElement('section');sec.id='uhaul-interest';sec.className='section';sec.innerHTML='<div class="title"><div><h1>U-Haul Interest</h1><p>Community demand for DASH Services to offer U-Haul rental services.</p></div></div><div class="cards"><div class="card"><div class="label">COMMUNITY INTEREST</div><div class="value" id="uhaulInterestCount">0</div><div class="muted">Customers who said U-Haul rental services should be offered by DASH</div></div></div><div class="panel"><div class="body"><div class="notice"><b>What this means:</b> Each recorded response means a customer told DASH Services they would like U-Haul rental services to be offered. This is not a U-Haul reservation.</div><button class="btn light" id="uhaulInterestRefresh">Refresh Count</button><div class="mini" id="uhaulInterestUpdated" style="margin-top:10px"></div></div></div>';main.appendChild(sec);sec.querySelector('#uhaulInterestRefresh').onclick=refreshUhaulInterest}await refreshUhaulInterest()}catch(e){console.warn('U-Haul interest admin unavailable',e)}}
async function refreshUhaulInterest(){try{const doc=frame.contentDocument;if(!doc)return;const session=(await client.auth.getSession()).data.session;if(!session)return;const r=await fetch(SUPABASE_URL+'/functions/v1/uhaul-interest-admin',{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_PUBLISHABLE_KEY},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load U-Haul interest.');const count=doc.getElementById('uhaulInterestCount');if(count)count.textContent=Number(d.count||0);const updated=doc.getElementById('uhaulInterestUpdated');if(updated)updated.textContent='Last refreshed: '+new Date().toLocaleString()}catch(e){console.warn('U-Haul interest refresh failed',e)}}
async function loadPortal(){const {data,error}=await client.auth.getUser();if(error||!data?.user){location.replace('admin-login.html');return}const {data:s}=await client.auth.getSession(),token=s?.session?.access_token;if(!token){location.replace('admin-login.html');return}const response=await fetch(SUPABASE_URL+'/functions/v1/dash-admin-portal',{headers:{Authorization:'Bearer '+token}});if(!response.ok)throw Error('Protected admin portal could not be loaded.');frame.srcdoc=await response.text();frame.addEventListener('load',()=>{status.style.display='none';frame.style.display='block';signOut.style.display='block';refreshBookings();employeeTools();addAttendanceNav();addUhaulInterestNav();setTimeout(refreshBookings,500);setTimeout(refreshBookings,1500);setTimeout(addAttendanceNav,500);setTimeout(addAttendanceNav,1500);setTimeout(addUhaulInterestNav,500);setTimeout(addUhaulInterestNav,1500)},{once:true})}signOut.onclick=async()=>{await client.auth.signOut();location.replace('admin-login.html')};loadPortal().catch(e=>status.textContent=e.message||'Unable to verify administrator access.');client.auth.onAuthStateChange((_e,s)=>{if(!s)location.replace('admin-login.html')});
</script></body></html>
