<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DASH Services | Admin Portal</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="portal" src="admin-production.html" title="DASH Services Admin Portal"></iframe>
<script>
const frame=document.getElementById('portal');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const nav=[...doc.querySelectorAll('aside button')].find(b=>b.textContent.trim()==='Communications');
    const section=doc.getElementById('communications');
    if(!nav||!section)return;
    nav.textContent='Communications + Gmail';
    const existing=doc.getElementById('gmailConnectionPanel');
    if(existing)return;
    const panel=doc.createElement('div');
    panel.id='gmailConnectionPanel';
    panel.className='panel';
    panel.innerHTML='<div class="head"><h2>Gmail Connection</h2><span class="pill">Secure OAuth</span></div><div class="body"><p class="muted" style="margin-top:0">Connect the dedicated DASH Gmail account for business communications.</p><div class="rows"><div class="row"><div><strong>Gmail account</strong><span class="mini">supportdashservices@gmail.com</span></div><span class="pill">Dedicated account</span></div><div class="row"><div><strong>Customer-facing address</strong><span class="mini">support@dashservices.net</span></div><span class="pill">Reply-to</span></div></div><div class="toolbar" style="margin-top:15px"><a class="btn" href="admin-gmail-connection.html" target="_top">Open Gmail Connection</a></div></div>';
    section.appendChild(panel);
  }catch(e){console.error('Gmail portal integration:',e)}
});
</script>
</body>
</html>
