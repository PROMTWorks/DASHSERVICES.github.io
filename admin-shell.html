async function refreshBookings(){try{const session=(await client.auth.getSession()).data.session;if(!session||!frame.contentDocument)return;const r=await fetch(SUPABASE_URL+'/functions/v1/dash-admin-bookings',{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_PUBLISHABLE_KEY},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load bookings.');const doc=frame.contentDocument,nav=[...doc.querySelectorAll('aside button')].find(b=>b.textContent.trim().replace(/\s*\(\d+\)$/,'')==='Bookings');if(nav)nav.textContent='Bookings ('+Number(d.count||0)+')';const list=doc.querySelector('#bookingList');if(list&&Array.isArray(d.bookings)){list.innerHTML=d.bookings.length?d.bookings.map((x,i)=>{const name=[x.first_name,x.last_name].filter(Boolean).join(' ');return `<div class="row"><div><strong>${show(x.request_number||x.client_request_number||'DASH Request')}</strong><span class="mini">${show(name)} · ${show(x.email)} · ${show(x.phone)}</span><span class="mini"><b>Service:</b> ${show(x.service_name||x.service_key)} · ${show([x.preferred_date,x.preferred_time].filter(Boolean).join(' '))}</span><span class="mini"><b>Vehicle Year:</b> ${show(x.vehicle_year)} · <b>Make:</b> ${show(x.vehicle_make)}</span><span class="mini"><b>Model:</b> ${show(x.vehicle_model)} · <b>Engine:</b> ${show(x.vehicle_engine)} · <b>Trim:</b> ${show(x.vehicle_trim)}</span><span class="mini">${show([x.city,x.state,x.postal_code].filter(Boolean).join(', '))}</span><span class="mini">${show(x.full_address)}</span></div><div class="toolbar"><span class="pill">${show(x.request_status||'submitted')}</span><span class="pill">Proof: ${show(x.proof_status||'not_required')}</span><button class="btn light" data-erase-index="${i}">Erase Booking</button></div></div>`}).join(''):'<div class="empty"><strong>No bookings yet</strong>No service requests have been submitted.</div>';list.querySelectorAll('[data-erase-index]').forEach(b=>b.onclick=async()=>{const x=d.bookings[Number(b. async function employeeTools(){try{const doc=frame.contentDocument;if(!doc||!doc.getElementById('employees'))return;const section=doc.getElementById('employees'),body=section.querySelector('.body');if(!body||doc.getElementById('dashEmployeeTools'))return;const box=doc.createElement('div');box.id='dashEmployeeTools';box.className='panel';box.style.marginBottom='18px';box.innerHTML='<div class="head"><h2>Employee Login & Schedule</h2></div><div class="body"><div class="form-grid"><label>Employee<select id="etEmployee"></select></label><label>Login Email<input id="etEmail" type="email"></label><label>New Password<input id="etPassword" type="password" minlength="12" placeholder="At least 12 characters"></label><label>Schedule Day<select id="etDay"><option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select></label><label>Start Time<input id="etStart" type="time"></label><label>End Time<input id="etEnd" type="time"></label><label>Location<input id="etLocation"></label><label>Notes<input id="etNotes"></label></div><div class="toolbar" style="margin-top:14px"><button class="btn" id="etCreate">Create Employee Login</button><button class="btn light" id="etReset">Reset Password</button><button class="btn light" id="etSchedule">Save Schedule</button></div><div class="mini" id="etStatus" style="margin-top:10px"></div></div>';section.insertBefore(box,body);const session=(await client.auth.getSession()).data.session;const r=await fetch(SUPABASE_URL+'/functions/v1/dash-admin-portal',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'list'})}),j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load employees');const sel=box.querySelector('#etEmployee');(j.data||[]).filter(e=>String(e.employment_status).toLowerCase()==='active').forEach(e=>{const o=doc.createElement('option');o.value=e.employee_id;o.textContent=[e.first_name,e.last_name].filter(Boolean).join(' ')+' — '+e.employee_id;o.dataset.email=e.email||'';o.dataset.user=e.user_id||'';sel.appendChild(o)});const sync=()=>{const o=sel.selectedOptions[0];box.querySelector('#etEmail').value=o?.dataset.email||''};sel.onchange=sync;sync();const call=async(action,payload)=>{const s=(await client.auth.getSession()).data.session;const rr=await fetch(SUPABASE_URL+'/functions/v1/employee-account-admin',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({action,...payload})}),jj=await rr.json();if(!rr.ok)throw Error(jj.error||'Request failed');return jj};box.querySelector('#etCreate').onclick=async()=>{try{const id=sel.value,em=box.querySelector('#etEmail').value.trim(),pw=box.querySelector('#etPassword').value;if(!pw||pw.length<12)throw Error('Use a password with at least 12 characters.');await call('create_account',{employee_id:id,email:em,password:pw});box.querySelector('#etStatus').textContent='Employee login created successfully.'}catch(e){box.querySelector('#etStatus').textContent=e.message}};box.querySelector('#etReset').onclick=async()=>{try{const pw=box.querySelector('#etPassword').value;if(!pw||pw.length<12)throw Error('Use a password with at least 12 characters.');await call('set_password',{employee_id:sel.value,password:pw});box.querySelector('#etStatus').textContent='Employee password updated.'}catch(e){box.querySelector('#etStatus').textContent=e.message}};box.querySelector('#etSchedule').onclick=async()=>{try{await call('schedule',{employee_id:sel.value,day_of_week:Number(box.querySelector('#etDay').value),start_time:box.querySelector('#etStart').value,end_time:box.querySelector('#etEnd').value,location:box.querySelector('#etLocation').value,notes:box.querySelector('#etNotes').value});box.querySelector('#etStatus').textContent='Schedule saved. It will appear in the employee portal.'}catch(e){box.querySelector('#etStatus').textContent=e.message}}}catch(e){console.warn('Employee tools unavailable',e)}}

async function addUhaulInterestNav(){try{const doc=frame.contentDocument;if(!doc)return;const aside=doc.querySelector('aside'),main=doc.querySelector('main');if(!aside||!main)return;if(!doc.getElementById('uhaulInterestNav')){const button=doc.createElement('button');button.id='uhaulInterestNav';button.className='nav-button';button.type='button';button.textContent='U-Haul Interest';button.onclick=()=>{[...doc.querySelectorAll('.section')].forEach(s=>s.classList.remove('active'));const sec=doc.getElementById('uhaul-interest');if(sec)sec.classList.add('active');[...doc.querySelectorAll('aside button')].forEach(b=>b.classList.remove('active'));button.classList.add('active');refreshUhaulInterest()};aside.appendChild(button)}if(!doc.getElementById('uhaul-interest')){const sec=doc.createElement('section');sec.id='uhaul-interest';sec.className='section';sec.innerHTML='<div class="title"><div><h1>U-Haul Interest</h1><p>Community demand for DASH MOBILE SERVICES to offer U-Haul rental services.</p></div></div><div class="cards"><div class="card"><div class="label">COMMUNITY INTEREST</div><div class="value" id="uhaulInterestCount">0</div><div class="muted">Customers who said U-Haul rental services should be offered by DASH</div></div></div><div class="panel"><div class="body"><div class="notice"><b>What this means:</b> Each recorded response means a customer told DASH MOBILE SERVICES they would like U-Haul rental services to be offered. This is not a U-Haul reservation.</div><button class="btn light" id="uhaulInterestRefresh">Refresh Count</button><div class="mini" id="uhaulInterestUpdated" style="margin-top:10px"></div></div></div>';main.appendChild(sec);sec.querySelector('#uhaulInterestRefresh').onclick=refreshUhaulInterest}await refreshUhaulInterest()}catch(e){console.warn('U-Haul interest admin unavailable',e)}}
async function refreshUhaulInterest(){try{const doc=frame.contentDocument;if(!doc)return;const session=(await client.auth.getSession()).data.session;if(!session)return;const r=await fetch(SUPABASE_URL+'/functions/v1/uhaul-interest-admin',{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_PUBLISHABLE_KEY},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load U-Haul interest.');const count=doc.getElementById('uhaulInterestCount');if(count)count.textContent=Number(d.count||0);const updated=doc.getElementById('uhaulInterestUpdated');if(updated)updated.textContent='Last refreshed: '+new Date().toLocaleString()}catch(e){console.warn('U-Haul interest refresh failed',e)}}
async function addBusinessOptimization(){try{const doc=frame.contentDocument;if(!doc)return;let sec=doc.getElementById('optimization');if(!sec){sec=doc.createElement('section');sec.id='optimization';sec.className='section';doc.querySelector('main')?.appendChild(sec)}sec.innerHTML='<div class="title"><div><h1>Business Optimization</h1><p>Use your DASH financial and operating targets to identify ways to improve revenue, profit, labor efficiency, and cash flow.</p></div></div><div class="panel"><div class="head"><h2>📊 Live Financial Data — <span id="boYear"></span></h2></div><div class="body"><div class="cards"><div class="card"><div class="label">GROSS REVENUE</div><div class="value" id="boGross">$0.00</div><div class="muted">Current calendar year</div></div><div class="card"><div class="label">BUSINESS EXPENSES</div><div class="value" id="boExpenses">$0.00</div><div class="muted">Current calendar year</div></div><div class="card"><div class="label">NET BUSINESS PROFIT</div><div class="value" id="boProfit">$0.00</div><div class="muted">Revenue minus expenses</div></div><div class="card"><div class="label">CURRENT BUSINESS CASH</div><div class="value" id="boCash">$0.00</div><div class="muted">Latest current-year entry</div></div></div><div class="grid2"><div class="row"><div><strong>Tax reserve</strong></div><div class="pill" id="boTax">$0.00</div></div><div class="row"><div><strong>Unpaid business obligations</strong></div><div class="pill" id="boObligations">$0.00</div></div><div class="row"><div><strong>Owner draws</strong></div><div class="pill" id="boDraws">$0.00</div></div><div class="row"><div><strong>Business cash reserve</strong></div><div class="pill" id="boReserve">$0.00</div></div></div><div class="mini" id="boStatus" style="margin-top:12px">Loading live financial data…</div></div></div><div class="panel"><div class="head"><h2>Business Goals & Assumptions</h2></div><div class="body"><div class="form"><div class="field"><label>Desired monthly revenue ($)</label><input id="boRevenue" type="number" min="0" step="0.01" value="10000"></div><div class="field"><label>Average booking price ($)</label><input id="boTicket" type="number" min="0" step="0.01" value="150"></div><div class="field"><label>Owner labor hours/month</label><input id="boHours" type="number" min="0" step="1" value="100"></div><div class="field"><label>Owner hourly target ($)</label><input id="boOwner" type="number" min="0" step="0.01" value="30"></div><div class="field"><label>Employee count</label><input id="boEmployees" type="number" min="0" step="1" value="0"></div><div class="field"><label>Employee hourly wage ($)</label><input id="boWage" type="number" min="0" step="0.01" value="10"></div><div class="field"><label>Average employee hours/month</label><input id="boEHours" type="number" min="0" step="1" value="0"></div><div class="field"><label>Estimated monthly overhead ($)</label><input id="boOverhead" type="number" min="0" step="0.01" value="0"></div></div><button class="btn" id="boUpdate" style="margin-top:18px">Update Optimization</button></div></div><div class="panel"><div class="head"><h2>💰 Profit Optimization</h2></div><div class="body" id="boProfitPanel"></div></div><div class="panel"><div class="head"><h2>👷 Workforce Optimization</h2></div><div class="body" id="boWorkforce"></div></div><div class="panel"><div class="head"><h2>🎯 Recommended Actions</h2></div><div class="body" id="boActions"></div></div><div class="panel"><div class="head"><h2>DASH Business Health</h2></div><div class="body" id="boHealth"></div></div>';
const money=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const year=new Date().getFullYear();doc.getElementById('boYear').textContent=year;
const calc=()=>{const r=+doc.getElementById('boRevenue').value||0,t=+doc.getElementById('boTicket').value||0,h=+doc.getElementById('boHours').value||0,o=+doc.getElementById('boOwner').value||0,e=+doc.getElementById('boEmployees').value||0,w=+doc.getElementById('boWage').value||0,eh=+doc.getElementById('boEHours').value||0,ov=+doc.getElementById('boOverhead').value||0,j=t?Math.ceil(r/t):0,oc=h*o,ew=e*eh*w,f=ew*.0765,p=r-oc-ew-f-ov;doc.getElementById('boProfitPanel').innerHTML='<div class="grid2"><div class="row"><strong>Target monthly revenue</strong><span class="pill">$'+money(r)+'</span></div><div class="row"><strong>Monthly job target</strong><span class="pill">'+j+'</span></div><div class="row"><strong>Owner labor target</strong><span class="pill">$'+money(oc)+'</span></div><div class="row"><strong>Employee wages</strong><span class="pill">$'+money(ew)+'</span></div><div class="row"><strong>Employer FICA estimate</strong><span class="pill">$'+money(f)+'</span></div><div class="row"><strong>Monthly overhead</strong><span class="pill">$'+money(ov)+'</span></div><div class="row"><strong>Estimated operating amount after these costs</strong><span class="pill">$'+money(p)+'</span></div></div>';doc.getElementById('boWorkforce').innerHTML='<div class="grid2"><div class="row"><strong>Current employees</strong><span class="pill">'+e+'</span></div><div class="row"><strong>Projected employee hours</strong><span class="pill">'+(e*eh).toLocaleString()+' hours/month</span></div><div class="row"><strong>Estimated employee wages</strong><span class="pill">$'+money(ew)+'</span></div></div>'+(e===0?'<div class="notice" style="margin-top:14px"><b>No employees assumed.</b> Employee payroll is currently $0.</div>':'');let a=p<0?'Current assumptions produce a negative operating amount. Increase revenue/pricing or reduce costs before expansion.':'Protect your target owner compensation before treating remaining operating profit as available growth cash.';if(e===0)a+='<br><br>Do not add e try{const r=await fetch(SUPABASE_URL+'/rest/v1/business_optimization_financial_summary?select=*',{headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:'Bearer '+SUPABASE_PUBLISHABLE_KEY},cache:'no-store'});if(!r.ok)throw Error('Financial summary unavailable');const rows=await r.json(),x=rows[0]||{};doc.getElementById('boGross').textContent='$'+money(x.gross_revenue);doc.getElementById('boExpenses').textContent='$'+money(x.deductible_business_expenses);doc.getElementById('boProfit').textContent='$'+money(x.net_business_profit);doc.getElementById('boCash').textContent='$'+money(x.current_cash);doc.getElementById('boTax').textContent='$'+money(x.tax_reserve);doc.getElementById('boObligations').textContent='$'+money(x.unpaid_business_obligations);doc.getElementById('boDraws').textContent='$'+money(x.owner_draws);doc.getElementById('boReserve').textContent='$'+money(x.business_cash_reserve);doc.getElementById('boStatus').textContent='Live financial summary loaded for '+year+'. Historical years remain stored separately.'}catch(e){doc.getElementById('boStatus').textContent='Live financial data is temporarily unavailable. Planning estimates remain available below.';console.warn('Business Optimization financial load failed',e)}}catch(e){console.warn('Business Optimization unavailable',e)}}
async function loadPortal(){const {data,error}=await client.auth.getUser();if(error||!data?.user){location.replace('admin-login.html');return}const {data:s}=await client.auth.getSession(),token=s?.session?.access_token;if(!token){location.replace('admin-login.html');return}const response=await fetch(SUPABASE_URL+'/functions/v1/dash-admin-portal',{headers:{Authorization:'Bearer '+token}});if(!response.ok)throw Error('Protected admin portal could not be loaded.');frame.srcdoc=await response.text();frame.addEventListener('load',()=>{status.style.display='none';frame.style.display='block';signOut.style.display='block';refreshBookings();employeeTools();addAttendanceNav();addUhaulInterestNav();addBusinessOptimization();setTimeout(refreshBookings,500);setTimeout(refreshBookings,1500);setTimeout(addAttendanceNav,500);setTimeout(addAttendanceNav,1500);setTimeout(addUhaulInterestNav,500);setTimeout(addUhaulInterestNav,1500);setTimeout(addBusinessOptimization,500);setTimeout(addBusinessOptimization,1500)},{once:true})}signOut.onclick=async()=>{await client.auth.signOut();location.replace('admin-login.html')};loadPortal().catch(e=>status.textContent=e.message||'Unable to verify administrator access.');client.auth.onAuthStateChange((_e,s)=>{if(!s)location.replace('admin-login.html')});
