<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DASH Services | My Direct Deposit</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f5f8;color:#17202a}.wrap{max-width:900px;margin:auto;padding:28px}.panel{background:#fff;border:1px solid #e2e7ed;border-radius:12px;padding:20px;margin-bottom:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e2e7ed;padding-bottom:12px;margin-bottom:16px}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid #ccd4de;border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 14px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.light{background:#fff;color:#17202a;border:1px solid #d7dde5}.full{grid-column:1/-1}.msg{display:none;padding:12px;border-radius:8px;margin-bottom:15px}.msg.show{display:block}.ok{background:#ecfdf5;color:#065f46}.bad{background:#fef2f2;color:#991b1b}.masked{font-family:monospace;font-weight:700}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:18px}.head{align-items:flex-start;flex-direction:column}} </style></head><body><div class="wrap"><div class="head"><div><h1>My Direct Deposit</h1><div id="who" class="muted">Loading…</div></div><div><button class="btn light" onclick="location.href='employee-portal.html'">Employee Portal</button><button class="btn" id="signout">Sign Out</button></div></div><div id="msg" class="msg"></div><div class="panel"><p class="muted">Enter or update your payroll payment method. Routing and account numbers are encrypted before storage. After saving, only the last 4 digits are shown.</p><div class="grid"><div class="field"><label>Payment Method</label><select id="method" onchange="toggle()"><option value="not_set_up">Not Set Up</option><option value="direct_deposit">Direct Deposit</option><option value="paper_check">Paper Check</option><option value="other">Other</option></select></div><div class="field"><label>Account Type</label><select id="type"><option value="checking">Checking</option><option value="savings">Savings</option></select></div><div class="field"><label>Bank Name</label><input id="bank" autocomplete="off"></div><div class="field"><label>Routing Number</label><input id="routing" inputmode="numeric" maxlength="9" autocomplete="off"></div><div class="field"><label>Account Number</label><input id="account" inputmode="numeric" maxlength="17" autocomplete="off"></div><div class="field"><label>Confirm Account Number</label><input id="confirm" inputmode="numeric" maxlength="17" autocomplete="off"></div><div class="field"><label>Deposit Allocation</label><select id="allocType"><option value="percent">Percent of net pay</option><option value="fixed">Fixed dollar amount</option><option value="remaining">Remaining net pay</option></select></div><div class="field"><label>Allocation</label><input id="alloc" type="number" min="0" step="0.01" value="100"></div><div class="full muted" id="saved"></div></div><div class="actions"><button class="btn" onclick="save()">Save Direct Deposit</button></div></div></div><script>const U='https://roywoofgypiyoobdcrwx.supabase.co',K='sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_',C=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id);function show(t,ok=false){$('msg').textContent=t;$('msg').className='msg show '+(ok?'ok':'bad')}function toggle(){const on=$('method').value==='direct_deposit';['type','bank','routing','account','confirm','allocType','alloc'].forEach(id=>$(id).disabled=!on)}async function api(action,p={}){const {data}=await C.auth.getSession();if(!data.session)throw Error('Your session has expired.');const r=await fetch(U+'/functions/v1/employee-portal-api',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action,...p})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed.');return j}function fill(dd){dd=dd||{};$('method').value=dd.payment_method||'not_set_up';$('type').value=dd.account_type||'checking';$('bank').value=dd.bank_name||'';$('routing').value='';$('account').value='';$('confirm').value='';$('allocType').value=dd.deposit_allocation_type||'percent';$('alloc').value=dd.deposit_allocation??100;$('saved').textContent=dd.account_last4?'Saved account ending in •••• '+dd.account_last4+(dd.bank_name?' · '+dd.bank_name:''):(dd.direct_deposit_status==='active'?'Direct deposit is active.':'No direct deposit is currently saved.');toggle()}async function load(){try{const j=await api('dashboard');$('who').textContent='Employee '+j.employee.employee_id+' · '+[j.employee.first_name,j.employee.last_name].filter(Boolean).join(' ');fill(j.direct_deposit)}catch(e){show(e.message)}}async function save(){try{const method=$('method').value,p={payment_method:method,bank_name:$('bank').value.trim()||null,account_type:$('type').value,deposit_allocation_type:$('allocType').value,deposit_allocation:Number($('alloc').value||0)};if(method==='direct_deposit'){const a=$('account').value.trim(),c=$('confirm').value.trim(),r=$('routing').value.trim();if(a!==c)throw Error('Account numbers do not match.');if(!/^\d{9}$/.test(r))throw Error('Routing number must contain 9 digits.');if(!/^\d{4,17}$/.test(a))throw Error('Account number must contain 4 to 17 digits.');p.routing_number=r;p.account_number=a}const j=await api('save_direct_deposit',p);fill(j.direct_deposit);show('Direct deposit information saved.',true)}catch(e){show(e.message)}}$('signout').onclick=async()=>{await C.auth.signOut();location.replace('employee-login.html')};(async()=>{const {data}=await C.auth.getSession();if(!data.session){location.replace('employee-login.html');return}await load()})();</script></body></html>
