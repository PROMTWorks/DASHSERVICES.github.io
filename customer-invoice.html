<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DASH Mobile Services | Invoice</title><style>body{margin:0;background:#f4f6f8;color:#17202a;font-family:Arial}.wrap{max-width:760px;margin:40px auto;padding:20px}.invoice{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:34px;box-shadow:0 8px 30px #0000000d}.top{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #17202a;padding-bottom:20px}.brand{font-size:24px;font-weight:900}.muted{color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0}.box{background:#f8fafc;border-radius:10px;padding:15px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e2e8f0}.total{font-size:24px;font-weight:900}.status{font-weight:800}.btn{margin-top:22px;border:0;border-radius:8px;padding:11px 16px;background:#111827;color:#fff;font-weight:700;cursor:pointer}@media(max-width:600px){.top,.grid{display:block}.grid .box{margin:12px 0}.invoice{padding:20px}}</style></head><body><div class="wrap"><div id="app" class="invoice">Loading invoice…</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://roywoofgypiyoobdcrwx.supabase.co','sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_');const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v||0));const token=new URLSearchParams(location.search).get('token');(async()=>{if(!token){app.innerHTML='<h2>Invoice link is incomplete</h2><p class="muted">Please use the invoice link sent by DASH Mobile Services.</p>';return}let {data,error}=await db.rpc('get_customer_invoice',{p_token:token});if(error||!data?.length){app.innerHTML='<h2>Invoice not found</h2><p class="muted">This invoice link may be invalid.</p>';return}let x=data[0];await db.rpc('mark_customer_invoice_viewed',{p_token:token});app.innerHTML='<div class="top"><div><div class="brand">DASH MOBILE SERVICES</div><div class="muted">Professional service, simplified.</div></div><div><b>INVOICE</b><br>#'+esc(x.invoice_number)+'</div></div><div class="grid"><div class="box"><b>BILL TO</b><br>'+esc(x.customer_name||'Customer')+'<br><span class="muted">'+esc(x.customer_email||'')+'</span></div><div class="box"><b>SERVICE</b><br>'+esc(x.service_name||'DASH Service')+'<br><span class="muted">'+esc(x.service_location||'')+'</span></div></div><div class="row"><span>Invoice date</span><span>'+new Date(x.created_at).toLocaleDateString()+'</span></div><div class="row"><span>Due date</span><span>'+(x.due_at?new Date(x.due_at).toLocaleDateString():'Due upon receipt')+'</span></div><div class="row"><span>Status</span><span class="status">'+esc(String(x.status||'draft').replace(/_/g,' ').toUpperCase())+'</span></div><div class="row total"><span>Total Due</span><span>'+money(x.amount)+'</span></div>'+(x.notes?'<p><b>Notes</b><br>'+esc(x.notes)+'</p>':'')+'<button class="btn" onclick="window.print()">Print / Save PDF</button></div>'})()</script></body></html>
