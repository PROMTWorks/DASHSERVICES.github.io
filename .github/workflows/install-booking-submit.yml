name: Install booking submission client

on:
  push:
    paths:
      - 'booking-submit.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add booking submission script to customer page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('book-service.html')
          s = p.read_text()
          tag = '<script src="booking-submit.js?v=20260819v2" defer></script>'
          old = '<script src="booking-submit.js?v=20260819v1" defer></script>'
          if old in s:
              s = s.replace(old, tag, 1)
          elif tag not in s:
              marker = '<script src="vehicle-database.js" defer></script>'
              if marker not in s:
                  raise SystemExit('vehicle database script marker not found')
              s = s.replace(marker, marker + '\n' + tag, 1)
          p.write_text(s)
          PY
      - name: Commit only the booking page wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book-service.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire customer booking submission client'
          git push
