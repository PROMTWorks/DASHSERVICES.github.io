name: Install booking submission client

on:
  push:
    paths:
      - 'booking-submit.js'
      - 'automotive-booking-fix.js'
      - '.github/workflows/install-booking-submit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add booking scripts to customer page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('book-service.html')
          s = p.read_text()
          marker = '<script src="vehicle-database.js" defer></script>'
          booking = '<script src="booking-submit.js?v=20260821v4" defer></script>'
          fix = '<script src="automotive-booking-fix.js?v=20260821v1" defer></script>'
          if booking not in s:
              if marker not in s:
                  raise SystemExit('vehicle database script marker not found')
              s = s.replace(marker, marker + '\n' + booking, 1)
          if fix not in s:
              anchor = booking
              if anchor not in s:
                  raise SystemExit('booking submission script marker not found')
              s = s.replace(anchor, anchor + '\n' + fix, 1)
          p.write_text(s)
          PY
      - name: Commit only the booking page wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book-service.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix automotive booking page wiring'
          git push
