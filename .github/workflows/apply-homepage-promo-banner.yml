name: Apply DASH homepage promo banner

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/apply-homepage-promo-banner.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add clean promotional banner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          if 'id="dash-homepage-promo"' in html:
              raise SystemExit('Banner already present; no change needed.')
          css = '''
          .dash-promo-section{max-width:1100px;margin:0 auto;padding:34px 24px 18px;background:var(--bg)}
          .dash-promo-link{display:block;text-decoration:none}
          .dash-promo-image{display:block;width:100%;height:auto;max-height:360px;object-fit:cover;border-radius:20px;border:1px solid var(--line);box-shadow:0 18px 42px rgba(15,23,42,.12);transition:transform .18s ease,box-shadow .18s ease}
          .dash-promo-link:hover .dash-promo-image{transform:translateY(-2px);box-shadow:0 22px 48px rgba(15,23,42,.16)}
          .dash-promo-label{text-align:center;margin-top:12px;font-size:11px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;color:var(--red)}
          @media(max-width:800px){.dash-promo-section{padding:26px 18px 12px}.dash-promo-image{border-radius:16px}}
          '''
          html = html.replace('</style>', css + '\n</style>', 1)
          marker = '<section class="section"><div class="section-head"><div class="kicker">Getting started</div>'
          banner = '''<section id="dash-homepage-promo" class="dash-promo-section" aria-label="DASH Mobile Services promotion">
          <a class="dash-promo-link" href="book-service.html?v=20260816" aria-label="Request a DASH Mobile Services service">
            <img class="dash-promo-image" src="Company%20Banner.png" alt="DASH Mobile Services promotional advertisement">
          </a>
          <div class="dash-promo-label">DASH MOBILE SERVICES • LOCAL SERVICE • SIMPLE BOOKING</div>
          </section>
          '''
          if marker not in html:
              raise SystemExit('Homepage insertion point not found. No changes made.')
          html = html.replace(marker, banner + marker, 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit homepage change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/apply-homepage-promo-banner.yml
          git commit -m 'Add clean promotional banner to homepage'
          git push
