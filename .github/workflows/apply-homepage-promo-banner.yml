name: Apply homepage promotional banner

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/apply-homepage-promo-banner.yml'

permissions:
  contents: write

jobs:
  apply-banner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add promotional banner to homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          if 'id="dash-promo-banner"' in html:
              print('Promotional banner already present; nothing to change.')
              raise SystemExit(0)
          css = '''
          .promo-banner-section{max-width:1100px;margin:0 auto;padding:34px 24px 18px;background:var(--bg)}
          .promo-banner-link{display:block;text-decoration:none}
          .promo-banner{display:block;width:100%;height:auto;max-height:360px;object-fit:cover;border-radius:20px;border:1px solid var(--line);box-shadow:0 18px 42px rgba(15,23,42,.12);transition:transform .18s ease,box-shadow .18s ease}
          .promo-banner-link:hover .promo-banner{transform:translateY(-2px);box-shadow:0 22px 48px rgba(15,23,42,.16)}
          .promo-banner-label{text-align:center;font-size:11px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;color:var(--red);margin-top:12px}
          @media(max-width:800px){.promo-banner-section{padding:26px 18px 12px}.promo-banner{border-radius:16px}}
          '''
          html = html.replace('</style>', css + '\n</style>', 1)
          marker = '<section class="section"><div class="section-head"><div class="kicker">Getting started</div>'
          banner = '''<section id="dash-promo-banner" class="promo-banner-section" aria-label="DASH Mobile Services promotion">
          <a class="promo-banner-link" href="book-service.html?v=20260816" aria-label="Learn more and request a DASH Mobile Services service">
            <img class="promo-banner" src="Company%20Banner.png" alt="DASH Mobile Services promotional banner">
          </a>
          <div class="promo-banner-label">DASH MOBILE SERVICES • LOCAL SERVICE • SIMPLE BOOKING</div>
          </section>
          '''
          if marker not in html:
              raise SystemExit('Expected homepage section marker was not found; no changes made.')
          html = html.replace(marker, banner + marker, 1)
          path.write_text(html, encoding='utf-8')
          print('Homepage promotional banner added.')
          PY

      - name: Commit homepage change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No homepage change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add clean promotional banner to homepage'
          git push
