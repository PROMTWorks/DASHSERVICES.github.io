name: Connect Admin Communications

on:
  push:
    branches: [main]
    paths-ignore:
      - 'admin.html'

permissions:
  contents: write

jobs:
  update-admin-communications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Communications section
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<section id="communications"')
          if start == -1:
              raise SystemExit('Communications section not found in admin.html')
          end = s.find('</section>', start)
          if end == -1:
              raise SystemExit('Communications section closing tag not found')
          end += len('</section>')
          new = '''<section id="communications" class="section">
          <div class="page-title"><div><h1>Communications</h1><p>DASH Services customer communications and automated email controls.</p></div></div>
          <div class="notice"><strong>Prototype mode:</strong> The email interface is ready, but no live Gmail connection is active yet. Your Gmail password must never be stored in this website or GitHub.</div>
          <div class="grid2">
            <div class="panel">
              <div class="panel-head"><h2>Automated Email Test</h2></div>
              <div class="panel-body">
                <div class="form-grid">
                  <div class="field"><label>From</label><input value="davidroyemployment@gmail.com" readonly></div>
                  <div class="field"><label>Test To</label><input value="djroy20.2004@gmail.com" readonly></div>
                </div>
                <div class="field" style="margin-top:16px"><label>Subject</label><input value="DASH Services — Automated Email Test" readonly></div>
                <div class="field" style="margin-top:16px"><label>Test Message</label><textarea readonly>This is a test email from DASH Services to ensure the automated email system is working correctly leading up to launch day.</textarea></div>
                <button class="btn" style="margin-top:16px" disabled title="Enable after secure email authorization is connected">Send Test Automated Email</button>
                <p class="muted" style="margin-top:10px">Status: <strong>Not connected</strong> — live sending will be enabled after secure email authorization is configured.</p>
              </div>
            </div>
            <div class="panel">
              <div class="panel-head"><h2>Email System Status</h2></div>
              <div class="panel-body">
                <div class="detail"><h3>Sending Account</h3><p>davidroyemployment@gmail.com</p></div>
                <div class="detail"><h3>Test Destination</h3><p>djroy20.2004@gmail.com</p></div>
                <div class="detail"><h3>Connection</h3><p><span class="status pending">Not Connected</span></p></div>
                <div class="detail"><h3>Last Test</h3><p>No live automated email test has been sent yet.</p></div>
              </div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>Planned Automated Emails</h2></div>
            <div class="panel-body"><div class="grid3">
              <div class="detail"><h3>Booking Confirmation</h3><p>Sent after DASH verifies payment and officially confirms a booking.</p></div>
              <div class="detail"><h3>Payment / Booking Updates</h3><p>Used for payment-pending, payment-reversal, late-payment, and scheduling updates.</p></div>
              <div class="detail"><h3>Complaint Decisions</h3><p>Used for official complaint, refund, and complimentary re-service decisions.</p></div>
            </div></div>
          </div>
          <div class="security"><strong>Security:</strong> Gmail credentials and other email secrets will be stored outside the GitHub source code and connected through a secure backend when live email sending is enabled.</div>
        </section>'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
      - name: Update production portal Communications section
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('admin-production.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'<section id="communications" class="section">.*?</section>\n<section id=', re.S)
          replacement = '''<section id="communications" class="section"><div class="title"><div><h1>Communications</h1><p>Customer and internal communication center.</p></div></div><div id="communicationsSuperAdmin"><div class="panel"><div class="head"><h2>Gmail Connection</h2><span class="pill">DASH Support</span></div><div class="body"><div class="security"><b>Dedicated Gmail:</b> supportdashservices@gmail.com<br><span class="mini">Customer-facing address: support@dashservices.net</span></div><p class="muted">Connect the dedicated DASH support Gmail account for customer communication. Your existing admin login is not changed by this connection.</p><a class="btn" href="admin-gmail-connection.html">Open Gmail Connection</a></div></div></div><div id="communicationsManager" class="hidden"><div class="panel"><div class="head"><h2>Company Email Addresses</h2><span class="pill">Read Only</span></div><div class="body"><div class="rows"><div class="row"><div><strong>Customer-facing support</strong><span class="mini">The public address customers can use to contact DASH Services.</span></div><span class="pill">support@dashservices.net</span></div><div class="row"><div><strong>Business Gmail</strong><span class="mini">Internal company Gmail account. Managers cannot connect, replace, disconnect, or edit it.</span></div><span class="pill">supportdashservices@gmail.com</span></div></div></div></div><div class="panel"><div class="body empty"><strong>Communication history</strong>Communication history will appear here when real customer or employee communications are connected.</div></div></div><script>(async()=>{try{const c=window.supabase?.createClient('https://roywoofgypiyoobdcrwx.supabase.co','sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_',{auth:{persistSession:true,autoRefreshToken:true}});if(!c)return;const {data,error}=await c.rpc('get_my_admin_access');if(error||!data)return;const role=String(data.role||'').toUpperCase();if(role!=='SUPER_ADMIN'){const sa=document.getElementById('communicationsSuperAdmin');const mgr=document.getElementById('communicationsManager');if(sa)sa.classList.add('hidden');if(mgr)mgr.classList.remove('hidden')}}catch(e){console.error('Communications role view failed',e)}})();</script></section>
<section id='''
          if not pattern.search(s):
              raise SystemExit('Communications section not found in admin-production.html')
          p.write_text(pattern.sub(replacement, s, count=1), encoding='utf-8')
      - name: Commit updated admin portals
        run: |
          git config user.name "DASH Services Automation"
          git config user.email "actions@github.com"
          git add admin.html admin-production.html
          git diff --cached --quiet && exit 0
          git commit -m "Make Manager Communications read-only"
          git push
