name: Install live booking details viewer
on:
  push:
    branches: [main]
    paths:
      - 'admin-booking-details.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add booking details script to production admin source
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin-production.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="admin-booking-details.js?v=20260819v1" defer></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit installation
        run: |
          git config user.name 'DASH Services Automation'
          git config user.email 'actions@github.com'
          git add admin-production.html
          git diff --cached --quiet && exit 0
          git commit -m 'Install clickable live booking details viewer'
          git push
