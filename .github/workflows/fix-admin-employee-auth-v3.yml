name: Fix live Admin Portal employee controls v3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken employee loader with Supabase session based loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('admin-production.html')
          s = p.read_text()
          marker = '<script id="DASH_EMPLOYEE_ADMIN_V3">'
          if marker in s:
              raise SystemExit(0)
          start = s.find('<script id="DASH_EMPLOYEE_ADMIN_V2">')
          if start < 0:
              raise SystemExit('DASH_EMPLOYEE_ADMIN_V2 not found')
          end = s.find('</script>', start)
          if end < 0:
              raise SystemExit('employee script closing tag not found')
          end += len('</script>')
          script = r'''<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script id="DASH_EMPLOYEE_ADMIN_V3">
const EMP_SUPABASE_URL='https://roywoofgypiyoobdcrwx.supabase.co';
const EMP_SUPABASE_KEY='sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_';
const EMP_API=EMP_SUPABASE_URL+'/functions/v1/employee-admin-api';
const empClient=window.supabase.createClient(EMP_SUPABASE_URL,EMP_SUPABASE_KEY);
let adminEmployees=[], editingAdminEmployee=null;
async function employeeToken(){
  const {data}=await empClient.auth.getSession();
  if(data&&data.session&&data.session.access_token)return data.session.access_token;
  const raw=localStorage.getItem('supabase.auth.token');
  if(raw){try{const x=JSON.parse(raw);return x.currentSession?.access_token||x.access_token||''}catch(_){}}
  for(const k of Object.keys(localStorage)){
    if(k.startsWith('sb-')&&k.endsWith('-auth-token')){try{const x=JSON.parse(localStorage.getItem(k));return x.access_token||x.currentSession?.access_token||''}catch(_){}}
  }
  return '';
}
async function employeeApi(path='',opts={}){
  const token=await employeeToken();
  if(!token)throw new Error('Your Admin Portal session has expired. Sign out and sign back in.');
  const headers={apikey:EMP_SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})};
  const r=await fetch(EMP_API+path,{...opts,headers});
  const text=await r.text();
  let j={};try{j=text?JSON.parse(text):{}}catch(_){j={error:text||'Empty server response'}}
  if(!r.ok)throw new Error(j.error||j.message||('Employee request failed ('+r.status+')'));
  return j;
}
async function loadAdminEmployees(){
  const h=document.getElementById('adminEmployeeRecords');if(!h)return;
  h.innerHTML='<div class="empty"><strong>Loading employee records...</strong></div>';
  try{
    const j=await employeeApi();
    adminEmployees=Array.isArray(j.data)?j.data:[];
    h.innerHTML=adminEmployees.length?adminEmployees.map(e=>{
      const id=String(e.employee_id??'');
      const n=[e.first_name,e.last_name].filter(Boolean).join(' ')||'Unnamed';
      const pay=e.hourly_pay_rate==null?'—':'$'+Number(e.hourly_pay_rate).toFixed(2)+'/hr';
      const safeId=encodeURIComponent(id);
      return '<div class="row"><div><strong>'+esc(n)+'</strong><span class="mini">ID: '+esc(id||'—')+' · '+esc(e.position||'—')+' · '+esc(e.role||'—')+'</span><span class="mini">Phone: '+esc(e.phone||'—')+' · Email: '+esc(e.email||'—')+' · Pay: '+esc(pay)+'</span></div><div class="toolbar"><button class="btn light" onclick="editAdminEmployee(\''+safeId+'\')">Edit</button><button class="btn light" onclick="editAdminPay(\''+safeId+'\')">Edit Pay</button><button class="btn light" onclick="removeAdminEmployee(\''+safeId+'\')">Remove</button><span class="pill">'+esc(e.employment_status||'active')+'</span></div></div>';
    }).join(''):'<div class="empty"><strong>No employee records</strong>Add your first employee.</div>';
  }catch(e){h.innerHTML='<div class="empty"><strong>Unable to load employees</strong><div style="margin-top:8px">'+esc(e.message)+'</div><button class="btn" style="margin-top:12px" onclick="loadAdminEmployees()">Try Again</button></div>';}
}
function findAdminEmployee(id){return adminEmployees.find(x=>String(x.employee_id)===String(id));}
function openAdminEmployeeForm(e=null){editingAdminEmployee=e;document.getElementById('adminEmployeeModalTitle').textContent=e?'Edit Employee':'Add Employee';const m=e||{};[['ae_id','employee_id'],['ae_first','first_name'],['ae_last','last_name'],['ae_email','email'],['ae_phone','phone'],['ae_position','position'],['ae_pay','hourly_pay_rate'],['ae_hire','hire_date'],['ae_notes','notes']].forEach(([a,b])=>{const el=document.getElementById(a);if(el)el.value=m[b]??''});document.getElementById('ae_role').value=m.role||'employee';document.getElementById('ae_status').value=m.employment_status||'active';document.getElementById('adminEmployeeModal').classList.add('show')}
function closeAdminEmployeeForm(){document.getElementById('adminEmployeeModal').classList.remove('show');editingAdminEmployee=null}
function editAdminEmployee(id){const e=findAdminEmployee(decodeURIComponent(id));if(e)openAdminEmployeeForm(e)}
async function editAdminPay(id){const e=findAdminEmployee(decodeURIComponent(id));if(!e)return;const v=prompt('Enter new hourly pay rate for '+([e.first_name,e.last_name].filter(Boolean).join(' ')||'employee'),e.hourly_pay_rate??'');if(v===null)return;const n=Number(v);if(!Number.isFinite(n)||n<0){alert('Enter a valid non-negative hourly rate.');return}try{await employeeApi('?employee_id='+encodeURIComponent(e.employee_id),{method:'PATCH',body:JSON.stringify({hourly_pay_rate:n})});await loadAdminEmployees()}catch(x){alert(x.message)}}
async function saveAdminEmployee(){const id=document.getElementById('ae_id').value.trim();const payload={employee_id:id,first_name:document.getElementById('ae_first').value.trim(),last_name:document.getElementById('ae_last').value.trim(),email:document.getElementById('ae_email').value.trim()||null,phone:document.getElementById('ae_phone').value.trim()||null,position:document.getElementById('ae_position').value.trim()||null,role:document.getElementById('ae_role').value,employment_status:document.getElementById('ae_status').value,hourly_pay_rate:document.getElementById('ae_pay').value===''?null:Number(document.getElementById('ae_pay').value),hire_date:document.getElementById('ae_hire').value||null,notes:document.getElementById('ae_notes').value.trim()||null};if(!id||!payload.first_name||!payload.last_name){alert('Employee ID, first name, and last name are required.');return}try{if(editingAdminEmployee)await employeeApi('?employee_id='+encodeURIComponent(editingAdminEmployee.employee_id),{method:'PATCH',body:JSON.stringify(payload)});else await employeeApi('',{method:'POST',body:JSON.stringify(payload)});closeAdminEmployeeForm();await loadAdminEmployees()}catch(e){alert(e.message)}}
async function removeAdminEmployee(id){const e=findAdminEmployee(decodeURIComponent(id));if(!e)return;const name=[e.first_name,e.last_name].filter(Boolean).join(' ')||'this employee';if(!confirm('Remove '+name+' from active Employee Records?'))return;try{await employeeApi('?employee_id='+encodeURIComponent(e.employee_id),{method:'DELETE'});await loadAdminEmployees()}catch(x){alert(x.message)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>'''
          s=s[:start]+script+s[end:]
          p.write_text(s)
          PY
      - name: Commit patched portal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-production.html
          git diff --cached --quiet || git commit -m 'Fix Admin Portal employee loading and management'
          git push
