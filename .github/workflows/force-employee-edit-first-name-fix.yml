name: Force Employee Edit First Name Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch employee edit validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('employee-management.html')
          text = path.read_text(encoding='utf-8')
          old = "if(isEdit&&!firstName){firstName=String(existing?.first_name??editingEmployee?.first_name??'').trim();}"
          new = "if(isEdit&&!firstName){firstName=String(existing?.first_name??editingEmployee?.first_name??'').trim();}"
          if old not in text:
              old = "if(!firstName)throw new Error('First name is required.');if(!employeeId)throw new Error('Employee ID is required.');"
              new = "if(isEdit&&!firstName){firstName=String(existing?.first_name??editingEmployee?.first_name??'').trim();}if(!firstName&&!isEdit)throw new Error('First name is required when adding a new employee.');if(!employeeId)throw new Error('Employee ID is required.');"
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add employee-management.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix employee edit first name validation [skip ci]"
          git push
