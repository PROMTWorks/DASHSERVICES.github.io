name: Add All Services footer link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-footer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add All Services to sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<div class="footer-column"><a href="book-service.html?v=20260816">Book a Service</a></div>'
          new = '<div class="footer-column"><a href="all-services.html">All Services</a><a href="book-service.html?v=20260816">Book a Service</a></div>'
          if 'href="all-services.html">All Services</a>' not in s:
              if old not in s:
                  raise SystemExit('Expected footer block was not found')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add All Services to footer sitemap"
          git push
