name: Force Direct Deposit Management Link v2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch management page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('employee-management.html'); s=p.read_text()
          if 'Manage Direct Deposit' not in s:
              s,n=re.subn(r'<div\s+class="modal-actions">', '<div style="margin-top:18px"><button class="light" type="button" onclick="location.href=\'employee-direct-deposit.html?employee=\'+encodeURIComponent(document.getElementById(\'employeeId\').value)">Manage Direct Deposit</button></div>\n\n<div class="modal-actions">', s, count=1)
              if n: p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add employee-management.html
          git diff --cached --quiet || git commit -m 'Add Manage Direct Deposit to employee edit'
          git push