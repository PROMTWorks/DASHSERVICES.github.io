name: Fix Business Optimization Link

on:
  push:
    paths:
      - '.github/workflows/fix-business-optimization-link.yml'

permissions:
  contents: write

jobs:
  fix-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Business Optimization navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin-production.html')
          s = p.read_text(encoding='utf-8')
          old = "<button onclick=\"show('optimization',this)\">Business Optimization</button>"
          new = "<button onclick=\"location.href='admin-business-optimization.html'\">Business Optimization</button>"
          if old not in s:
              raise SystemExit('Expected Business Optimization navigation button was not found.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-production.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Business Optimization admin navigation"
          git push
