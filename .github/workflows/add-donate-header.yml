name: Ensure exactly one Donate to DASH button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ensure-one-donate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep exactly one customer Donate button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          donate = '<a class="donate-cta" href="https://www.gofundme.com/f/help-get-dash-mobile-services-on-the-road" target="_blank" rel="noopener noreferrer">DONATE TO DASH</a>'
          booking = '<a class="nav-cta" href="book-service.html?v=20260816">BOOK A SERVICE</a>'

          # Remove all legacy Donate variants from the navigation, then add exactly one.
          s = re.sub(r'<a class="(?:donate-cta|nav-donate)"[^>]*>\s*DONATE TO DASH\s*</a>', '', s)
          if booking not in s:
              raise SystemExit('Expected booking header link was not found')
          s = s.replace(booking, donate + booking, 1)

          # Remove legacy Donate styling if it was previously injected into the source.
          s = re.sub(r'<style[^>]*id=["\']dash-donate-header-style["\'][^>]*>.*?</style>', '', s, flags=re.I | re.S)

          # Permanently neutralize any legacy nav-donate element that may be injected by stale cached markup.
          guard_style = 'nav .nav-donate{display:none!important;}'
          if guard_style not in s:
              s = s.replace('</style>', guard_style + '</style>', 1)

          guard_script = '''<script>
(function(){
  function removeLegacyDonate(){
    document.querySelectorAll('nav .nav-donate').forEach(function(el){el.remove();});
    document.querySelectorAll('#dash-donate-header-style').forEach(function(el){el.remove();});
  }
  removeLegacyDonate();
  new MutationObserver(removeLegacyDonate).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>'''
          if 'removeLegacyDonate' not in s:
              s = s.replace('</body>', guard_script + '</body>', 1)

          p.write_text(s)
          PY
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove duplicate Donate button from customer navigation"
          git push
