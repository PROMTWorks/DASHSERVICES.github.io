name: Ensure only one Donate to DASH button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ensure-one-donate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove the duplicate Donate button and keep the injected one
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          # Remove the source donate-cta button. The live navigation already
          # supplies the single nav-donate button; this prevents two buttons.
          s = re.sub(r'<a class="donate-cta"[^>]*>\s*DONATE TO DASH\s*</a>', '', s)
          # Remove any stale source nav-donate markup if present so the live
          # navigation cannot contain two copies in the HTML itself.
          s = re.sub(r'<a class="nav-donate"[^>]*>\s*DONATE TO DASH\s*</a>', '', s)
          p.write_text(s)
          PY
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove duplicate Donate to DASH source button"
          git push
