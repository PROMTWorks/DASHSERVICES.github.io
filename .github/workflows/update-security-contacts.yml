name: Update Security Activity and U-Haul Contacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update admin Security & Activity section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin-production.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<section id="security" class="section">')
          end = s.find('<section id="settings"', start)
          if start < 0 or end < 0:
              raise SystemExit('Security/settings section markers not found')

          new = r'''<section id="security" class="section">

<div class="title">
<div>
<h1>Security & Activity</h1>
<p>Authentication, access logs, security providers, vehicle tracking, and emergency contacts.</p>
</div>
</div>

<div class="notice">
<b>Super Admin only:</b>
Security provider and emergency-contact information is restricted to authorized administrators. Audit history will populate as secure authentication and administrative activity tracking are enabled.
</div>

<div class="panel">
<div class="head"><h2>Security Activity</h2></div>
<div class="body empty">
<strong>No activity records</strong>
Audit history will populate after secure authentication is implemented.
</div>
</div>

<div class="title" style="margin-top:26px">
<div>
<h2 style="margin:0;font-size:22px">Security Providers & Contacts</h2>
<p>Super Admin-only information for property security, vehicle tracking, dash cameras, U-Haul, and emergency contacts.</p>
</div>
</div>

<div class="cards security-contact-cards">
<div class="card security-contact-card"><div class="label">📹 PROPERTY SECURITY</div><div class="value security-contact-status" id="securityStatus-property">Not configured yet</div><div class="muted" id="securitySummary-property"></div><button class="btn" style="margin-top:14px" onclick="openSecurityContact('property','Property Security')">Add / Edit</button></div>
<div class="card security-contact-card"><div class="label">🚨 ALARM / MONITORING COMPANY</div><div class="value security-contact-status" id="securityStatus-alarm">Not configured yet</div><div class="muted" id="securitySummary-alarm"></div><button class="btn" style="margin-top:14px" onclick="openSecurityContact('alarm','Alarm / Monitoring Company')">Add / Edit</button></div>
<div class="card security-contact-card"><div class="label">🔐 ACCESS CONTROL PROVIDER</div><div class="value security-contact-status" id="securityStatus-access">Not configured yet</div><div class="muted" id="securitySummary-access"></div><button class="btn" style="margin-top:14px" onclick="openSecurityContact('access','Access Control Provider')">Add / Edit</button></div>
<div class="card security-contact-card"><div class="label">🚗 COMPANY VEHICLE GPS TRACKING</div><div class="value security-contact-status" id="securityStatus-gps">Not configured yet</div><div class="muted" id="securitySummary-gps"></div><button class="btn" style="margin-top:14px" onclick="openSecurityContact('gps','Company Vehicle GPS Tracking')">Add / Edit</button></div>
<div class="card security-contact-card"><div class="label">📹 COMPANY VEHICLE DASH CAMERAS</div><div class="value security-contact-status" id="securityStatus-dashcam">Not configured yet</div><div class="muted" id="securitySummary-dashcam"></div><button class="btn" style="margin-top:14px" onclick="openSecurityContact('dashcam','Company Vehicle Dash Cameras')">Add / Edit</button></div>
<div class="card security-contact-card"><div class="label">📞 EMERGENCY & SECURITY CONTACTS</div><div class="value security-contact-status" id="securityStatus-emergency">Not configured yet</div><div class="muted" id="securitySummary-emergency"></div><button class="btn" style="margin-top:14px" onclick="openSecurityContact('emergency','Emergency & Security Contacts')">Add / Edit</button></div>
<div class="card security-contact-card" style="grid-column:1/-1"><div class="label">🚚 U-HAUL CONTACT</div><div class="value security-contact-status" id="securityStatus-uhaul">U-Haul</div><div class="muted" id="securitySummary-uhaul">Phone: Not entered · Contact: Not entered</div><div class="toolbar" style="margin-top:14px"><button class="btn" onclick="openSecurityContact('uhaul','U-Haul Contact')">View / Edit</button><a class="btn light" href="https://www.uhaul.com/Contact/" target="_blank" rel="noopener">U-Haul Contact Page</a></div></div>
</div>

</section>

'''
          s = s[:start] + new + s[end:]

          style = r'''
<style id="security-contact-styles">
.security-contact-cards{grid-template-columns:repeat(2,1fr)}
.security-contact-card .value{font-size:18px;line-height:1.3}
@media(max-width:700px){.security-contact-cards{grid-template-columns:1fr}}
</style>
'''
          if 'id="security-contact-styles"' not in s:
              s = s.replace('</head>', style + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit admin portal changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-production.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep U-Haul phone field blank"
          git push
