name: Fix Employee Management Supabase Loader
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Supabase browser loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('employee-management.html')
          s=p.read_text()
          s=s.replace('https://unpkg.com/@supabase/supabase-js@2','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add employee-management.html
          git diff --cached --quiet || git commit -m 'Fix Employee Management Supabase loader'
          git push
