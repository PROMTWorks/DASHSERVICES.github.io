name: Force Direct Deposit Management Link
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch employee edit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('employee-management.html'); s=p.read_text()
          if 'Manage Direct Deposit' not in s:
              s=s.replace('<div class="modal-actions">','<div style="margin-top:18px"><button class="light" type="button" onclick="location.href=\'employee-direct-deposit.html?employee=\'+encodeURIComponent(document.getElementById(\'employeeId\').value)">Manage Direct Deposit</button></div><div class="modal-actions">',1)
              p.write_text(s)
          p=Path('employee-direct-deposit.html'); s=p.read_text()
          if 'new URLSearchParams(location.search)' not in s:
              needle="employees.map(e=>'<option value=\"'+e.employee_id+'\">'+e.first_name+' '+(e.last_name||'')+' — '+e.employee_id+'</option>').join('')"
              if needle in s:
                  s=s.replace(needle,needle+";let q=new URLSearchParams(location.search).get('employee');if(q){$('employee').value=q;loadEmployee()}",1); p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add employee-management.html employee-direct-deposit.html
          git diff --cached --quiet || git commit -m 'Add direct deposit management button'
          git push