name: Replace DASH Services Branding

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace DASH Services branding in all text files
        shell: bash
        run: |
          set -e
          changed=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico|*.pdf|*.zip|*.woff|*.woff2|*.ttf) continue ;;
            esac
            if grep -Iq . "$file" 2>/dev/null; then
              before=$(sha256sum "$file" | cut -d' ' -f1)
              perl -0pi -e 's/DASH SERVICES/DASH MOBILE SERVICES/g; s/DASH Services/DASH MOBILE SERVICES/g; s/Dash Services/DASH MOBILE SERVICES/g' "$file"
              after=$(sha256sum "$file" | cut -d' ' -f1)
              if [ "$before" != "$after" ]; then
                git add "$file"
                changed=1
              fi
            fi
          done < <(git ls-files -z)

          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update DASH Services branding to DASH Mobile Services"
            git push origin HEAD:main
          else
            echo "No old DASH Services branding remains in tracked text files."
          fi
