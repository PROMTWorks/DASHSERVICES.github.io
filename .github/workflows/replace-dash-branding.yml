name: Update DASH Mobile Services legal branding

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update customer-facing legal identity
        shell: bash
        run: |
          set -e
          changed=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico|*.pdf|*.zip|*.woff|*.woff2|*.ttf) continue ;;
            esac
            if grep -Iq . "$file" 2>/dev/null; then
              before=$(sha256sum "$file" | cut -d' ' -f1)
              python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          try:
              s = p.read_text(encoding='utf-8')
          except UnicodeDecodeError:
              raise SystemExit(0)

          # Customer-facing brand only. Keep PROMT Works, email addresses,
          # URLs, JS identifiers, and other technical names unchanged.
          s = s.replace('DASH SERVICES', 'DASH MOBILE SERVICES')
          s = s.replace('DASH Services', 'DASH MOBILE SERVICES')
          s = s.replace('Dash Services', 'DASH MOBILE SERVICES')

          # Make the legal relationship explicit where the site already
          # identifies the public-facing brand.
          s = s.replace(
              'DASH MOBILE SERVICES is the public-facing brand of PROMTWORKS.',
              'DASH MOBILE SERVICES is the DBA (doing business as) name of PROMT WORKS, LLC.'
          )
          s = s.replace(
              'DASH MOBILE SERVICES is the public-facing brand of PROMT Works, LLC.',
              'DASH MOBILE SERVICES is the DBA (doing business as) name of PROMT WORKS, LLC.'
          )
          s = s.replace(
              '© 2026 DASH MOBILE SERVICES. All rights reserved.',
              '© 2026 PROMT WORKS, LLC. DASH MOBILE SERVICES is the DBA. All rights reserved.'
          )
          p.write_text(s, encoding='utf-8')
          PY
              after=$(sha256sum "$file" | cut -d' ' -f1)
              if [ "$before" != "$after" ]; then
                git add "$file"
                changed=1
              fi
            fi
          done < <(git ls-files -z)

          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Clarify PROMT Works legal name and DASH Mobile Services DBA"
            git push origin HEAD:main
          else
            echo "No customer-facing branding changes were needed."
          fi
