name: Fix Employee Records Navigation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch admin navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-production.html')
          s=p.read_text(encoding='utf-8')
          old="<button onclick=\"show('employees',this);loadAdminEmployees()\">Employee Records</button>"
          new="<button onclick=\"window.location.href='employee-management.html'\">Employee Records</button>"
          if old not in s:
              print('Target not found; checking variants')
              variants=[
                '<button onclick="show(\'employees\',this);loadAdminEmployees()">Employee Records</button>',
                '<button onclick="show(\'employees\',this); loadAdminEmployees()">Employee Records</button>',
              ]
              for v in variants:
                  if v in s:
                      s=s.replace(v,new,1)
                      break
              else:
                  raise SystemExit('Employee Records navigation target was not found; no changes made.')
          else:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-production.html
          git diff --cached --quiet && { echo 'No changes needed'; exit 0; }
          git commit -m 'Fix Employee Records navigation'
          git push origin main
