name: Install Admin Role Guard
on:
  push:
    branches: [main]
    paths:
      - 'admin-role-guard.js'
      - 'admin-waitlist.js'
      - '.github/workflows/install-admin-role-guard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject admin modules
        shell: python
        run: |
          from pathlib import Path
          for name in ['admin-v2.html','admin-production.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              for src in ['admin-role-guard.js','admin-waitlist.js']:
                  marker=src
                  if marker not in s:
                      tag=f'<script src="{src}?v=20260821"></script>\n'
                      if '</body>' in s:
                          s=s.replace('</body>',tag+'</body>',1)
                      elif '</html>' in s:
                          s=s.replace('</html>',tag+'</html>',1)
                      else:
                          s += '\n'+tag
              p.write_text(s,encoding='utf-8')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-v2.html admin-production.html
          if git diff --cached --quiet; then
            echo 'No portal injection changes needed.'
            exit 0
          fi
          git commit -m 'Connect admin wait list module'
          git push
