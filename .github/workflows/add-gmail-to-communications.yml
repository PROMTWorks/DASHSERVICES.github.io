name: Add Gmail Connection to Communications

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-communications:
    if: ${{ !contains(github.event.head_commit.message, '[gmail-nav-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Gmail Connection panel
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('admin-production.html')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(r'<section id="communications" class="section">.*?</section>\n<section id=', re.S)
          replacement = '''<section id="communications" class="section"><div class="title"><div><h1>Communications</h1><p>Customer and internal communication center.</p></div></div><div class="panel"><div class="head"><h2>Gmail Connection</h2><span class="pill">DASH Support</span></div><div class="body"><div class="security"><b>Connected mailbox:</b> supportdashservices@gmail.com<br><span class="mini">Customer-facing address: support@dashservices.net</span></div><p class="muted">Connect the dedicated DASH support Gmail account for customer communication. Your existing admin login is not changed by this connection.</p><a class="btn" href="admin-gmail-connection.html">Open Gmail Connection</a></div></div><div class="panel"><div class="body empty"><strong>Communication history</strong>Communication history will appear here when real customer or employee communications are connected.</div></div></section>
<section id='''

          if not pattern.search(text):
              raise SystemExit('Communications section not found; no changes made.')

          updated = pattern.sub(replacement, text, count=1)
          if updated == text:
              raise SystemExit('No change made.')

          path.write_text(updated, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-production.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Gmail connection to admin Communications [gmail-nav-patched]"
          git push
