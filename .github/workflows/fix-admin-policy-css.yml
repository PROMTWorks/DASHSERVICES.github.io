name: Fix Admin Policy Styling

on:
  push:
    branches: [main]
    paths:
      - 'policies/customer-policies/.sync-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair policy styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin-v2.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n<style>\n\.policy-folder-grid.*?</style>\n', '\n', s, count=1, flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v2.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix admin policy integration styling"
          git push
