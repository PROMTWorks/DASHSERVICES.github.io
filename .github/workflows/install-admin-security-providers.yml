name: Install Admin Security Providers
on:
  push:
    branches: [main]
    paths:
      - 'admin-security-providers.js'
      - '.github/workflows/install-admin-security-providers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject security provider module into production portal
        shell: python
        run: |
          from pathlib import Path
          for name in ['admin-production.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              filename='admin-security-providers.js'
              if filename not in s:
                  tag='<script src="admin-security-providers.js?v=20260821-1"></script>\n'
                  if '</body>' in s:
                      s=s.replace('</body>',tag+'</body>',1)
                  elif '</html>' in s:
                      s=s.replace('</html>',tag+'</html>',1)
                  else:
                      s += '\n'+tag
                  p.write_text(s,encoding='utf-8')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-production.html
          if git diff --cached --quiet; then
            echo 'Security provider module already installed.'
            exit 0
          fi
          git commit -m 'Install security provider and vehicle tracking sections'
          git push
