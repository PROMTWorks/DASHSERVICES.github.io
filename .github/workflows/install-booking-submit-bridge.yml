name: Install booking submission bridge

on:
  push:
    paths:
      - 'booking-submit.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install booking bridge in customer page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('book-service.html')
          s = p.read_text()
          tag = '<script src="booking-submit.js?v=20260819v1" defer></script>'
          if tag not in s:
              marker = '<script src="vehicle-database.js" defer></script>'
              if marker not in s:
                  raise SystemExit('vehicle-database script marker not found')
              s = s.replace(marker, marker + '\n' + tag, 1)
              p.write_text(s)
          PY
      - name: Commit customer booking bridge
        shell: bash
        run: |
          if git diff --quiet -- book-service.html; then
            echo 'Booking bridge already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book-service.html
          git commit -m 'Connect customer booking submission to Supabase'
          git push
