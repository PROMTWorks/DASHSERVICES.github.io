name: Install Admin Shell Role Guard
on:
  push:
    branches: [main]
    paths:
      - 'admin-shell-role-guard.js'
      - '.github/workflows/install-admin-shell-role-guard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject role guard into admin shell
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin-shell.html')
          s=p.read_text(encoding='utf-8')
          marker='admin-shell-role-guard.js'
          if marker not in s:
              tag='<script src="admin-shell-role-guard.js?v=20260821"></script>\n'
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-shell.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Connect admin shell to role-based permissions'
          git push
