name: Add comprehensive vehicle database
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject-vehicle-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject vehicle database script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="vehicle-database.js"></script>'
          if tag not in s:
              marker='</body>'
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "PROMT WORKS"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable comprehensive vehicle database"
          git push
