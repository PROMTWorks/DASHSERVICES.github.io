name: Fix Admin Portal Employee Management V3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace employee management script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin-production.html')
          s=p.read_text()
          start=s.find('<script id="DASH_EMPLOYEE_ADMIN_V2">')
          if start < 0:
              start=s.find('<script id="DASH_EMPLOYEE_ADMIN_V3">')
          if start < 0:
              raise SystemExit('Employee management script marker not found')
          end=s.find('</script>',start)
          if end < 0:
              raise SystemExit('Employee management script end not found')
          end += len('</script>')
          script=r'''<script id="DASH_EMPLOYEE_ADMIN_V3">
          const EMP_SUPABASE_URL='https://roywoofgypiyoobdcrwx.supabase.co';
          const EMP_SUPABASE_KEY='sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_';
          const EMP_API=EMP_SUPABASE_URL+'/functions/v1/employee-management';
          let adminEmployees=[], editingAdminEmployee=null, employeeClient=null;
          async function ensureEmployeeClient(){
            if(window.supabase?.createClient){
              if(!employeeClient) employeeClient=window.supabase.createClient(EMP_SUPABASE_URL,EMP_SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
              return employeeClient;
            }
            await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sc.onload=resolve;sc.onerror=()=>reject(new Error('Unable to load Supabase client'));document.head.appendChild(sc)});
            employeeClient=window.supabase.createClient(EMP_SUPABASE_URL,EMP_SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
            return employeeClient;
          }
          async function employeeApi(action,payload={}){
            const c=await ensureEmployeeClient();
            const {data,error}=await c.auth.getSession();
            const token=data?.session?.access_token;
            if(error||!token) throw new Error('Your admin session has expired. Please sign in again.');
            const r=await fetch(EMP_API,{method:'POST',headers:{Authorization:'Bearer '+token,apikey:EMP_SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({action,...payload}),cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            if(!r.ok||j.error) throw new Error(j.error||'Employee request failed');
            return j.data||[];
          }
          function loadAdminEmployees(){
            const h=document.getElementById('adminEmployeeRecords');
            if(!h)return;
            h.innerHTML='<div class="empty"><strong>Loading employee records...</strong></div>';
            employeeApi('list').then(rows=>{
              adminEmployees=Array.isArray(rows)?rows:[];
              h.innerHTML=adminEmployees.length?adminEmployees.map(e=>{
                const n=[e.first_name,e.last_name].filter(Boolean).join(' ')||'Unnamed';
                const pay=e.hourly_pay_rate==null?'—':'$'+Number(e.hourly_pay_rate).toFixed(2)+'/hr';
                const id=String(e.employee_id).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
                return `<div class="row"><div><strong>${esc(n)}</strong><span class="mini">ID: ${esc(e.employee_id||'—')} · ${esc(e.position||'—')} · ${esc(e.role||'—')}</span><span class="mini">Phone: ${esc(e.phone||'—')} · Email: ${esc(e.email||'—')} · Pay: ${esc(pay)}</span></div><div class="toolbar"><button class="btn light" onclick="editAdminEmployee('${id}')">Edit</button><button class="btn light" onclick="editAdminPay('${id}')">Edit Pay</button><button class="btn light" onclick="removeAdminEmployee('${id}')">Remove</button><span class="pill">${esc(e.employment_status||'active')}</span></div></div>`;
              }).join(''):'<div class="empty"><strong>No employee records</strong>Add your first employee.</div>';
            }).catch(e=>h.innerHTML='<div class="empty"><strong>Unable to load employees</strong><p>'+esc(e.message)+'</p><button class="btn" onclick="loadAdminEmployees()">Try Again</button></div>');
          }
          function openAdminEmployeeForm(e=null){
            editingAdminEmployee=e;
            document.getElementById('adminEmployeeModalTitle').textContent=e?'Edit Employee':'Add Employee';
            const m=e||{};
            [['ae_id','employee_id'],['ae_first','first_name'],['ae_last','last_name'],['ae_email','email'],['ae_phone','phone'],['ae_position','position'],['ae_pay','hourly_pay_rate'],['ae_hire','hire_date'],['ae_notes','notes']].forEach(([a,b])=>{const el=document.getElementById(a);if(el)el.value=m[b]??''});
            const role=document.getElementById('ae_role');if(role)role.value=m.role||'employee';
            const status=document.getElementById('ae_status');if(status)status.value=m.employment_status||'active';
            document.getElementById('adminEmployeeModal').classList.add('show');
          }
          function closeAdminEmployeeForm(){document.getElementById('adminEmployeeModal').classList.remove('show')}
          function editAdminEmployee(id){const e=adminEmployees.find(x=>String(x.employee_id)===String(id));if(e)openAdminEmployeeForm(e)}
          async function editAdminPay(id){
            const e=adminEmployees.find(x=>String(x.employee_id)===String(id));if(!e)return;
            const v=prompt('Enter new hourly pay rate for '+([e.first_name,e.last_name].filter(Boolean).join(' ')||'employee'),e.hourly_pay_rate??'');
            if(v===null)return;const n=Number(v);if(!Number.isFinite(n)||n<0){alert('Enter a valid non-negative hourly rate.');return}
            try{await employeeApi('pay',{employee_id:e.employee_id,hourly_pay_rate:n});await loadAdminEmployees();alert('Pay updated successfully.')}catch(x){alert(x.message)}
          }
          async function saveAdminEmployee(){
            const id=document.getElementById('ae_id').value.trim();
            const payload={employee_id:id,first_name:document.getElementById('ae_first').value.trim(),last_name:document.getElementById('ae_last').value.trim(),email:document.getElementById('ae_email').value.trim()||null,phone:document.getElementById('ae_phone').value.trim()||null,position:document.getElementById('ae_position').value.trim()||null,role:document.getElementById('ae_role').value,employment_status:document.getElementById('ae_status').value,hourly_pay_rate:document.getElementById('ae_pay').value===''?null:Number(document.getElementById('ae_pay').value),hire_date:document.getElementById('ae_hire').value||null,notes:document.getElementById('ae_notes').value.trim()||null};
            if(!id||!payload.first_name||!payload.last_name){alert('Employee ID, first name, and last name are required.');return}
            try{if(editingAdminEmployee)await employeeApi('update',{...payload,old_employee_id:editingAdminEmployee.employee_id});else await employeeApi('add',payload);closeAdminEmployeeForm();await loadAdminEmployees();alert(editingAdminEmployee?'Employee updated successfully.':'Employee added successfully.')}catch(e){alert(e.message)}
          }
          async function removeAdminEmployee(id){
            const e=adminEmployees.find(x=>String(x.employee_id)===String(id));if(!e)return;
            if(!confirm('Remove '+([e.first_name,e.last_name].filter(Boolean).join(' ')||'this employee')+'?'))return;
            try{await employeeApi('remove',{employee_id:e.employee_id});await loadAdminEmployees();alert('Employee removed successfully.')}catch(e){alert(e.message)}
          }
          function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
          </script>'''
          s=s[:start]+script+s[end:]
          p.write_text(s)
          PY
      - name: Commit patched portal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-production.html
          git diff --cached --quiet || git commit -m 'Fix Admin Portal employee CRUD session handling'
          git push
