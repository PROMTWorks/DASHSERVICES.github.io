name: Add Ownership Transfer tabs

on:
  push:
    paths:
      - '.github/workflows/add-ownership-transfer-tab.yml'
      - 'owner-ownership-transfer.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-tabs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Ownership Transfer navigation without replacing portals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          # Existing production admin portal: preserve the original additive tab behavior.
          p = Path('admin-production.html')
          if p.exists():
              s = p.read_text()
              button = '<button onclick="location.href=\'admin-transfer-documents.html\'">Ownership Transfer</button>'
              marker = '<div class="group">Administration</div>'
              if 'location.href=\'admin-transfer-documents.html\'' not in s and marker in s:
                  s = s.replace(marker, button + '\n\n' + marker, 1)
                  p.write_text(s)

          # Owner Management: add the standalone Ownership Transfer tab loader only when it is missing.
          owner = Path('owner-management.html')
          if not owner.exists():
              raise SystemExit('owner-management.html not found; no owner portal change made.')
          s = owner.read_text()
          script_name = 'owner-ownership-transfer.js'
          if script_name not in s:
              src = f'<script src="{script_name}?v={os.environ.get("GITHUB_SHA", "latest")}" defer></script>'
              if '</body>' not in s:
                  raise SystemExit('owner-management.html has no closing body tag; owner portal was not changed.')
              s = s.replace('</body>', src + '\n</body>', 1)
              owner.write_text(s)
              print('Added Ownership Transfer loader to owner-management.html')
          else:
              print('Ownership Transfer loader already present; no owner portal change needed.')
          PY

      - name: Commit only the ownership-transfer navigation additions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-production.html owner-management.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Ownership Transfer to owner management'
          git push
