name: Add Ownership Transfer tab

on:
  push:
    paths:
      - '.github/workflows/add-ownership-transfer-tab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-tab:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Ownership Transfer tab without replacing portal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin-production.html')
          s = p.read_text()

          button = '<button onclick="location.href=\'admin-transfer-documents.html\'">Ownership Transfer</button>'
          marker = '<div class="group">Administration</div>'

          if 'admin-transfer-documents.html' not in s:
              if marker not in s:
                  raise SystemExit('Administration navigation marker not found; portal was not changed.')
              s = s.replace(marker, button + '\n\n' + marker, 1)
              p.write_text(s)

          PY

      - name: Commit only the navigation addition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-production.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Ownership Transfer tab to Super Admin portal'
          git push
