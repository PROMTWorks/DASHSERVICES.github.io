<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DASH Mobile Services | Dispatch Board</title><style>body{margin:0;font-family:Arial;background:#f3f5f8;color:#17202a}.top{background:#111827;color:#fff;padding:20px 28px;display:flex;justify-content:space-between}.brand{font-weight:800;letter-spacing:2px}.wrap{max-width:1400px;margin:auto;padding:28px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #e1e6eb;border-radius:12px;overflow:hidden;margin-bottom:18px}.head{padding:16px 18px;border-bottom:1px solid #e1e6eb;display:flex;justify-content:space-between}.body{padding:18px}.job,.emp{border:1px solid #e1e6eb;border-radius:9px;padding:14px;margin-bottom:10px}.job b,.emp b{display:block}.meta{font-size:13px;color:#64748b;margin:5px 0 10px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.pill{background:#eef2f7;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700}button,select{border:0;border-radius:7px;padding:9px 12px;font-weight:700}button{background:#111827;color:white;cursor:pointer}select{border:1px solid #ccd4de;background:white;max-width:230px}.empty{text-align:center;padding:30px;color:#64748b}.ok{background:#ecfdf5;color:#166534;padding:10px;border-radius:7px;margin-bottom:12px}.warn{background:#fff7ed;color:#9a3412;padding:10px;border-radius:7px;margin-bottom:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.bar{align-items:stretch;flex-direction:column}}</style></head><body><header class="top"><div class="brand">DASH MOBILE SERVICES</div><div>DISPATCH</div></header><main class="wrap"><div class="bar"><div><h1>Dispatch Board</h1><div class="meta">Assign employees to customer jobs while checking current employee status.</div></div><button onclick="location.href='admin-production.html'">← Admin Portal</button></div><div id="msg"></div><div class="grid"><section class="panel"><div class="head"><b>Jobs</b><span class="pill" id="jobCount">0</span></div><div class="body" id="jobs"><div class="empty">Loading jobs...</div></div></section><aside class="panel"><div class="head"><b>Available Employees</b><span class="pill" id="empCount">0</span></div><div class="body" id="employees"><div class="empty">Loading employees...</div></div></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://roywoofgypiyoobdcrwx.supabase.co','sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_');const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let jobs=[],employees=[],assignments=[];async function load(){let j=await db.from('business_jobs').select('*').order('scheduled_start',{ascending:true});let e=await db.from('employee_profiles').select('id,full_name,employee_number,role,employment_status').eq('employment_status','active').order('full_name');let a=await db.from('job_employee_assignments').select('*');if(j.error||e.error||a.error){$('msg').innerHTML='<div class="warn">Could not load dispatch data.</div>';return}jobs=j.data||[];employees=e.data||[];assignments=a.data||[];$('jobCount').textContent=jobs.length;$('empCount').textContent=employees.length;renderJobs();renderEmployees()}function renderJobs(){$('jobs').innerHTML=jobs.length?jobs.map(j=>{let aa=assignments.filter(a=>a.job_id===j.id);let assigned=aa.map(a=>employees.find(e=>e.id===a.employee_id)?.full_name).filter(Boolean);return `<article class="job"><div class="row"><b>${esc(j.service_name||j.title||'Service Job')}</b><span class="pill">${esc(j.status||'scheduled')}</span></div><div class="meta">${esc(j.customer_name||j.customer_id||'Customer')} · ${esc(j.service_location||j.address||'Location not set')}<br>${j.scheduled_start?new Date(j.scheduled_start).toLocaleString():''}</div><div>${assigned.length?'<b>Assigned:</b> '+assigned.map(esc).join(', '):'<span class="meta">Unassigned</span>'}</div><div class="row" style="margin-top:10px"><select id="emp-${j.id}"><option value="">Choose employee...</option>${employees.map(e=>`<option value="${e.id}">${esc(e.full_name)} · ${esc(e.role||'employee')}</option>`).join('')}</select><button onclick="assignJob('${j.id}')">Assign</button></div></article>`}).join(''):'<div class="empty">No jobs found.</div>'}function renderEmployees(){$('employees').innerHTML=employees.length?employees.map(e=>{let n=assignments.filter(a=>a.employee_id===e.id&&a.status==='assigned').length;return `<article class="emp"><div class="row"><b>${esc(e.full_name)}</b><span class="pill">${n} assigned</span></div><div class="meta">${esc(e.role||'employee')} · ${esc(e.employee_number||'No employee #')}</div></article>`}).join(''):'<div class="empty">No active employees.</div>'}async function assignJob(jobId){const id=$('emp-'+jobId).value;if(!id){$('msg').innerHTML='<div class="warn">Choose an employee first.</div>';return}const exists=assignments.find(a=>a.job_id===jobId&&a.employee_id===id);if(exists){$('msg').innerHTML='<div class="warn">That employee is already assigned to this job.</div>';return}const r=await db.from('job_employee_assignments').insert({job_id:jobId,employee_id:id,assignment_role:'primary',status:'assigned'});if(r.error){$('msg').innerHTML='<div class="warn">Assignment failed: '+esc(r.error.message)+'</div>';return}$('msg').innerHTML='<div class="ok">Employee assigned successfully.</div>';await load()}load();</script></body></html>
