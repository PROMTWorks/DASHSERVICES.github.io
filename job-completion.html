<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DASH Mobile Services | Job Completion</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#17202a}.top{background:#111827;color:#fff;padding:20px 28px;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:auto;padding:28px}.panel{background:#fff;border:1px solid #e1e6eb;border-radius:12px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.job{border:1px solid #e1e6eb;border-radius:9px;padding:14px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#64748b;font-size:13px}button{background:#111827;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer}button.alt{background:#fff;color:#111827;border:1px solid #ccd4de}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd4de;border-radius:7px;margin:6px 0 12px}.pill{font-size:11px;padding:5px 9px;background:#eef2f7;border-radius:20px;font-weight:700}.ok{background:#ecfdf5;color:#166534;padding:10px;border-radius:7px;margin-bottom:12px}.warn{background:#fff7ed;color:#9a3412;padding:10px;border-radius:7px;margin-bottom:12px}.empty{text-align:center;padding:28px;color:#64748b}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><b>DASH MOBILE SERVICES</b><span>JOB COMPLETION</span></header><main class="wrap"><div class="row"><div><h1>Job Completion</h1><p class="muted">Dispatch → Start → Complete → Customer sign-off.</p></div><button onclick="location.href='dispatch-board.html'">← Dispatch</button></div><div id="msg"></div><div class="grid"><section class="panel"><h2>Open Jobs</h2><div id="jobs"><div class="empty">Loading...</div></div></section><section class="panel"><h2>Complete Selected Job</h2><div id="selected" class="muted">Select a job.</div><form id="form" style="display:none"><label>Status</label><select id="status"><option value="in_progress">In Progress</option><option value="completed">Completed</option></select><label>Completion notes</label><textarea id="notes" rows="4" placeholder="Work completed, customer requests, issues..."></textarea><label>Customer sign-off name</label><input id="signoff" placeholder="Customer name"><label>Customer sign-off notes</label><textarea id="signoffNotes" rows="3"></textarea><button>Save Job Update</button></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://roywoofgypiyoobdcrwx.supabase.co','sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_');const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let jobs=[],selected=null;async function load(){const r=await db.from('business_jobs').select('*').not('status','in','("completed","cancelled")').order('scheduled_start',{ascending:true});if(r.error){$('msg').innerHTML='<div class="warn">Could not load jobs.</div>';return}jobs=r.data||[];render()}function render(){$('jobs').innerHTML=jobs.length?jobs.map(j=>`<article class="job"><div class="row"><b>${esc(j.service_name||j.title||'Service Job')}</b><span class="pill">${esc(j.status||'scheduled')}</span></div><p class="muted">${esc(j.customer_name||j.customer_id||'Customer')}<br>${esc(j.service_location||j.address||'Location not set')}<br>${j.scheduled_start?new Date(j.scheduled_start).toLocaleString():''}</p><button onclick="selectJob('${j.id}')">Open Job</button></article>`).join(''):'<div class="empty">No open jobs.</div>'}function selectJob(id){selected=jobs.find(j=>j.id===id);if(!selected)return;$('selected').innerHTML='<b>'+esc(selected.service_name||selected.title||'Service Job')+'</b><br><span class="muted">'+esc(selected.customer_name||selected.customer_id||'Customer')+' · '+esc(selected.service_location||selected.address||'')+'</span>';$('form').style.display='block';$('status').value=selected.status==='in_progress'?'in_progress':'completed'}$('form').onsubmit=async e=>{e.preventDefault();if(!selected)return;let data={status:$('status').value,completion_notes:$('notes').value||null};if($('status').value==='in_progress'&&!selected.started_at)data.started_at=new Date().toISOString();if($('status').value==='completed'){data.completed_at=new Date().toISOString();data.customer_signoff_at=$('signoff').value?new Date().toISOString():null;data.customer_signoff_name=$('signoff').value||null;data.customer_signoff_notes=$('signoffNotes').value||null}const r=await db.from('business_jobs').update(data).eq('id',selected.id);if(r.error){$('msg').innerHTML='<div class="warn">Could not save: '+esc(r.error.message)+'</div>';return}$('msg').innerHTML='<div class="ok">Job updated successfully.</div>';$('form').reset();selected=null;$('selected').textContent='Select a job.';$('form').style.display='none';load()};load();</script></body></html>
