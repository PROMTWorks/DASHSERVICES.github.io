<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DASH Services | Reset Password</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f5f8;color:#17202a;font-family:Arial,Helvetica,sans-serif}.box{width:min(430px,92vw);background:#fff;border:1px solid #e2e7ed;border-radius:14px;padding:30px;box-shadow:0 12px 35px rgba(15,23,42,.08)}h1{margin:0 0 6px;font-size:25px}.sub{color:#64748b;font-size:13px;margin-bottom:24px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #ccd4de;border-radius:8px;font-size:14px}.btn{width:100%;border:0;border-radius:8px;padding:11px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{background:#9ca3af;cursor:not-allowed}.status{margin-top:14px;font-size:13px;padding:11px;border-radius:8px;display:none}.status.show{display:block}.error{background:#fef2f2;color:#991b1b}.success{background:#ecfdf5;color:#166534}.security{margin-top:18px;padding:12px;border-radius:8px;background:#f8fafc;border:1px solid #e2e7ed;color:#475569;font-size:11px;line-height:1.5}</style>
</head>
<body>
<div class="box">
<h1>Set New Password</h1>
<div class="sub">DASH Services Secure Admin Portal</div>
<form id="resetForm">
<div class="field"><label for="password">New Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div>
<div class="field"><label for="confirm">Confirm New Password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required></div>
<button class="btn" id="saveBtn" type="submit">Update Password</button>
</form>
<div id="status" class="status"></div>
<div class="security"><b>Security:</b> Your password is handled by Supabase Auth and is never stored in this GitHub page.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://roywoofgypiyoobdcrwx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
const form=document.getElementById('resetForm'),btn=document.getElementById('saveBtn'),status=document.getElementById('status');
function show(message,type){status.textContent=message;status.className='status show '+type}
let ready=false;
function enableRecovery(session){if(session){ready=true;btn.disabled=false;show('Recovery link verified. Enter your new password.','success')}}
(async()=>{
 const hash=new URLSearchParams(window.location.hash.replace(/^#/,'')).get('access_token');
 const type=new URLSearchParams(window.location.hash.replace(/^#/,'')).get('type');
 if(type==='recovery'&&hash){
   const {data,error}=await client.auth.getSession();
   if(error||!data?.session){show('This password-reset link is invalid or has expired. Request a new reset email.','error');btn.disabled=true;return}
   enableRecovery(data.session);return;
 }
 const {data,error}=await client.auth.getSession();
 if(error||!data?.session){show('Open this page from the newest password-reset email.','error');btn.disabled=true;return}
 enableRecovery(data.session);
})();
client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)enableRecovery(session);});
form.addEventListener('submit',async e=>{
 e.preventDefault();
 if(!ready){show('Open this page using the newest password-reset email.','error');return}
 const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
 if(password!==confirm){show('The passwords do not match.','error');return}
 btn.disabled=true;show('Updating password…','success');
 const {error}=await client.auth.updateUser({password});
 if(error){show(error.message,'error');btn.disabled=false;return}
 show('Password updated. Returning to Admin Login…','success');
 await new Promise(r=>setTimeout(r,900));
 window.location.replace('admin-login.html');
});
</script>
</body>
</html>
