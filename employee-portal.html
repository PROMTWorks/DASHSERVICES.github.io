<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DASH Services | Employee Portal</title><style>body{margin:0;font-family:Arial;background:#f3f5f8;color:#17202a}.wrap{max-width:1100px;margin:auto;padding:30px}.card,.panel{background:#fff;border:1px solid #e2e7ed;border-radius:12px;padding:20px;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.value{font-size:24px;font-weight:800;margin:8px 0}.muted{color:#64748b;font-size:13px}.label{font-size:11px;color:#64748b;font-weight:800}.btn{border:0;border-radius:8px;padding:11px 16px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.head{display:flex;justify-content:space-between;border-bottom:1px solid #e2e7ed;padding-bottom:12px;margin-bottom:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e2e7ed;text-align:left;font-size:13px}.error{display:none;background:#fef2f2;color:#991b1b;padding:13px;border-radius:8px;margin-bottom:15px}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:550px){.wrap{padding:18px}.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div><h1>My Employee Portal</h1><div id="welcome" class="muted">Loading…</div></div><button class="btn" id="signout">Sign Out</button></div><div id="error" class="error"></div><div class="cards"><div class="card"><div class="label">THIS WEEK</div><div class="value" id="weekHours">0h 00m</div><div class="muted">Recorded hours</div></div><div class="card"><div class="label">TIME STATUS</div><div class="value" id="timeStatus">Clocked Out</div><div class="muted" id="shiftDuration">No active shift</div></div><div class="card"><div class="label">TODAY</div><div class="value" id="todayShift">Not Scheduled</div><div class="muted" id="todayDetail">No shift posted</div></div><div class="card"><div class="label">POSITION</div><div class="value" id="position">Employee</div><div class="muted" id="employeeId"></div></div></div><div class="panel"><div class="head"><b>My Time Clock</b><span id="clockMessage" class="muted">Ready</span></div><button class="btn" id="clockIn">Clock In</button> <button class="btn" id="clockOut">Clock Out</button><span id="liveTimer" class="muted"></span></div><div class="panel"><div class="head"><b>My Weekly Schedule</b></div><table class="table"><thead><tr><th>DAY</th><th>START</th><th>END</th><th>LOCATION</th><th>STATUS</th></tr></thead><tbody id="scheduleRows"></tbody></table></div><div class="panel"><div class="head"><b>My Time Records</b></div><table class="table"><thead><tr><th>DATE</th><th>CLOCK IN</th><th>CLOCK OUT</th><th>SHIFT LENGTH</th></tr></thead><tbody id="timeRows"></tbody></table></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://roywoofgypiyoobdcrwx.supabase.co';const SUPABASE_KEY='sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_';const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id),days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];let latest=null,timer=null;function hm(min){min=Math.max(0,Math.floor(min));return Math.floor(min/60)+'h '+String(min%60).padStart(2,'0')+'m'}function dur(a,b){return a?Math.max(0,(new Date(b||Date.now())-new Date(a))/60000):0}function tm(v){return v?new Date(v).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'—'}function dt(v){return v?new Date(v).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}):'—'}function clock(v){if(!v)return'—';let [h,m]=String(v).split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(action){const {data,error}=await client.auth.getSession();if(error||!data.session)throw Error('Your session has expired.');const r=await fetch(SUPABASE_URL+'/functions/v1/employee-portal-api',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed.');return j}function render(j){latest=j.current;let e=j.employee,entries=j.entries||[],schedules=j.schedules||[];$('welcome').textContent='Welcome, '+[e.first_name,e.last_name].filter(Boolean).join(' ')+' · '+e.employee_id;$('position').textContent=e.position||'Employee';$('employeeId').textContent='Employee ID: '+e.employee_id;$('weekHours').textContent=hm(entries.reduce((a,x)=>a+dur(x.clock_in,x.clock_out),0));let open=latest&&!latest.clock_out;$('timeStatus').textContent=open?'Clocked In':'Clocked Out';$('shiftDuration').textContent=open?hm(dur(latest.clock_in))+' this shift':latest?hm(dur(latest.clock_in,latest.clock_out))+' last shift':'No active shift';$('clockIn').disabled=open;$('clockOut').disabled=!open;let map=new Map(schedules.map(x=>[Number(x.day_of_week),x])),today=map.get(new Date().getDay());$('todayShift').textContent=today?clock(today.start_time)+' – '+clock(today.end_time):'Not Scheduled';$('todayDetail').textContent=today?(today.location||'Scheduled shift'):'No shift posted';$('scheduleRows').innerHTML=days.map((d,i)=>{let x=map.get(i);return '<tr><td>'+d+'</td><td>'+(x?clock(x.start_time):'—')+'</td><td>'+(x?clock(x.end_time):'—')+'</td><td>'+(x?esc(x.location||'—'):'—')+'</td><td>'+(x?'Scheduled':'Not Scheduled')+'</td></tr>'}).join('');$('timeRows').innerHTML=entries.length?entries.map(x=>'<tr><td>'+dt(x.clock_in)+'</td><td>'+tm(x.clock_in)+'</td><td>'+tm(x.clock_out)+'</td><td>'+ (x.clock_out?hm(dur(x.clock_in,x.clock_out)):'In progress')+'</td></tr>').join(''):'<tr><td colspan="4">No time records this week.</td></tr>';if(open)start();else stop()}function start(){stop();let tick=()=>{$('liveTimer').textContent=latest&&!latest.clock_out?'  Current shift: '+hm(dur(latest.clock_in)):''};tick();timer=setInterval(tick,30000)}function stop(){if(timer)clearInterval(timer);timer=null;$('liveTimer').textContent=''}async function load(){try{let j=await api('dashboard');render(j);$('error').style.display='none'}catch(e){$('error').textContent=e.message;$('error').style.display='block'}}$('clockIn').onclick=async()=>{try{$('clockMessage').textContent='Clocking in…';await api('clock_in');await load();$('clockMessage').textContent='Clocked in successfully.'}catch(e){$('clockMessage').textContent=e.message}};$('clockOut').onclick=async()=>{try{$('clockMessage').textContent='Clocking out…';let j=await api('clock_out');await load();$('clockMessage').textContent='Shift complete: '+hm(dur(j.entry.clock_in,j.entry.clock_out))}catch(e){$('clockMessage').textContent=e.message}};$('signout').onclick=async()=>{await client.auth.signOut();location.replace('employee-login.html')};(async()=>{let {data}=await client.auth.getSession();if(!data.session){location.replace('employee-login.html');return}let r=await fetch(SUPABASE_URL+'/functions/v1/employee-login-router',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+data.session.access_token}}),j=await r.json();if(!r.ok||!j.employee||j.role!=='employee'){await client.auth.signOut();location.replace('employee-login.html');return}await load()})();</script></body></html>
