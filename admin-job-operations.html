<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DASH | Job Operations</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f5f8;color:#17202a}.wrap{max-width:1400px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid #e2e7ed;border-radius:12px;padding:18px}.num{font-size:28px;font-weight:800;margin-top:6px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e2e7ed;text-align:left;font-size:13px}.table th{font-size:11px;color:#64748b;background:#f8fafc;text-transform:uppercase}.btn{border:0;border-radius:8px;padding:10px 14px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.light{background:#fff;color:#17202a;border:1px solid #d7dde5}.pill{padding:5px 8px;border-radius:20px;background:#eef2ff;font-size:11px}.error{display:none;background:#fef2f2;color:#991b1b;padding:12px;border-radius:8px;margin-bottom:15px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.head{flex-direction:column;align-items:flex-start}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:18px}}</style></head><body><div class="wrap"><div class="head"><div><h1 style="margin:0">DASH Job Operations</h1><div class="muted">Owner command center for jobs, assignments, status, checklists and completion.</div></div><div><button class="btn light" onclick="location.href='admin-v2.html'">← Admin Portal</button> <button class="btn" onclick="load()">Refresh</button></div></div><div id="error" class="error"></div><div class="grid"><div class="card"><div class="muted">TOTAL JOBS</div><div class="num" id="total">0</div></div><div class="card"><div class="muted">NEEDS ASSIGNMENT</div><div class="num" id="unassigned">0</div></div><div class="card"><div class="muted">IN PROGRESS</div><div class="num" id="progress">0</div></div><div class="card"><div class="muted">COMPLETED</div><div class="num" id="completed">0</div></div></div><div class="panel"><h2 style="margin-top:0">Job Queue</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Service</th><th>Location</th><th>Scheduled</th><th>Employee</th><th>Status</th><th>Checklist</th><th>Sign-off</th></tr></thead><tbody id="rows"><tr><td colspan="7">Loading…</td></tr></tbody></table></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://roywoofgypiyoobdcrwx.supabase.co',KEY='sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_';const client=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(v){return v?new Date(v).toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'—'}async function load(){try{const {data:{session}}=await client.auth.getSession();if(!session){location.replace('admin-login.html');return}const r=await fetch(URL+'/functions/v1/owner-job-operations-api',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'dashboard'})});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'Unable to load jobs.');const a=j.data||[];$('total').textContent=a.length;$('unassigned').textContent=a.filter(x=>!x.assigned_employee_id&&x.status!=='completed'&&x.status!=='cancelled').length;$('progress').textContent=a.filter(x=>x.status==='in_progress').length;$('completed').textContent=a.filter(x=>x.status==='completed').length;$('rows').innerHTML=a.length?a.map(x=>'<tr><td><b>'+esc(x.service_name)+'</b></td><td>'+esc(x.service_location||'—')+'</td><td>'+fmt(x.scheduled_start)+'</td><td>'+esc(x.assigned_employee_id||'Unassigned')+'</td><td><span class="pill">'+esc(x.status||'—')+'</span></td><td>'+x.checklist_completed+'/'+x.checklist_total+'</td><td>'+(x.customer_signed_off?'✓ Signed':'Pending')+'</td></tr>').join(''):'<tr><td colspan="7">No jobs currently recorded.</td></tr>';$("error").style.display='none'}catch(e){$("error").textContent=e.message;$("error").style.display='block'}}load();</script></body></html>
