TML=completed.length?completed.slice(0,10).map(x=>'<div class="row"><span>'+fmt(x.clock_in)+' → '+fmt(x.clock_out)+'</span><b>'+hrs(x.clock_in,x.clock_out).toFixed(2)+' hrs</b></div>').join(''):'<div class="muted">No completed shifts yet.'}async function action(a){const s=(await c.auth.getSession()).data.session,r=await fetch(U+'/functions/v1/employee-portal-api',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:a})}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');await dash()}$('f').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;show('Signing in…',false);const {data,error}=await c.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){show(error.message,true);$('loginBtn').disabled=false;return}const r=await fetch(U+'/functions/v1/employee-login-router',{headers:{apikey:K,Authorization:'Bearer '+data.session.access_token}}),j=await r.json();if(!r.ok){await c.auth.signOut();show(j.error||'This login is not active.',true);$('loginBtn').disabled=false;return}if(['owner','admin','hr'].includes(String(j.role).toLowerCase())){location.replace('admin-v2.html');return}if(j.role!=='employee'){await c.auth.signOut();show('This account is not authorized for the staff portal.',true);$('loginBtn').disabled=false;return}$('login').style.display='none';$('portal').style.display='block';try{await dash()}catch(e){show(e.message,true);$('portal').style.display='none';$('login').style.display='flex';await c.auth.signOut()}$('loginBtn').disabled=false};$('cin').onclick=async()=>{try{await action('clock_in');$('ps').textContent='Clocked in successfully.';$('ps').className='portalstatus ok'}catch(e){$('ps').textContent=e.message;$('ps').className='portalstatus err'}};$('cout').onclick=async()=>{try{await action('clock_out');$('ps').textContent='Clocked out successfully.';$('ps').className='portalstatus ok'}catch(e){$('ps').tex
