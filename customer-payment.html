<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DASH Mobile Services | Pay Invoice</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#17202a;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:30px auto;padding:18px}.card{background:#fff;border:1px solid #e1e6eb;border-radius:16px;padding:28px;box-shadow:0 8px 30px #0000000d}.top{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #17202a;padding-bottom:18px}.brand{font-size:23px;font-weight:900;letter-spacing:.5px}.muted{color:#64748b}.total{font-size:32px;font-weight:900;margin:18px 0}.alert{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:14px;margin:18px 0}.method{border:1px solid #dbe2e8;border-radius:12px;padding:17px;margin:12px 0}.method h3{margin:0 0 6px}.method p{margin:6px 0}.cash-tag{font-size:22px;font-weight:900;letter-spacing:.2px}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef2f7;font-size:11px;font-weight:800}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}label{font-size:12px;font-weight:800;color:#475569}input,select{width:100%;padding:11px;margin-top:6px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.full{grid-column:1/-1}button{margin-top:16px;border:0;border-radius:8px;padding:12px 17px;background:#111827;color:#fff;font-weight:800;cursor:pointer}.status{margin-top:15px;font-weight:800}@media(max-width:600px){.top,.fields{display:block}.fields>div{margin-top:12px}.card{padding:20px}}</style></head><body><main class="wrap"><section class="card" id="app">Loading invoice…</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://roywoofgypiyoobdcrwx.supabase.co','sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_');const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v||0));const token=new URLSearchParams(location.search).get('token');let invoice=null;(async()=>{if(!token){app.innerHTML='<h2>Payment link unavailable</h2><p class="muted">Please use the payment link provided by DASH Mobile Services.</p>';return}const {data,error}=await db.rpc('get_customer_invoice',{p_token:token});if(error||!data?.length){app.innerHTML='<h2>Invoice not found</h2><p class="muted">This payment link may be invalid or expired.</p>';return}invoice=data[0];await db.rpc('mark_customer_invoice_viewed',{p_token:token});render()})();function render(){const paid=['paid','payment_verified'].includes(invoice.status);app.innerHTML='<div class="top"><div><div class="brand">DASH MOBILE SERVICES</div><div class="muted">Secure invoice payment portal</div></div><div><b>INVOICE</b><br>#'+esc(invoice.invoice_number)+'</div></div><p><b>'+esc(invoice.customer_name||'Customer')+'</b><br><span class="muted">'+esc(invoice.service_name||'DASH Service')+'</span></p><div class="total">'+money(invoice.amount)+'</div><div class="badge">'+(paid?'PAYMENT VERIFIED':'PAYMENT REQUIRED BEFORE SERVICE')+'</div>'+(paid?'<div class="alert"><b>Your payment has been verified.</b><br>Your service can proceed according to your confirmed appointment.</div>':'<div class="alert"><b>Payment is required before DASH travels to your location or begins the service.</b><br><br>For now, DASH accepts Cash App or Venmo. If you do not use either service, please contact DASH before your appointment.</div><div class="method"><h3>Cash App</h3><p>Pay the exact invoice amount to the official DASH Mobile Services Cash App account:</p><p class="cash-tag">$DashMobileServicesSC</p><p class="muted">Please double-check the Cashtag before sending your payment. DASH will independently verify receipt.</p></div><div class="method"><h3>Venmo</h3><p>Pay the exact invoice amount using the Venmo information provided directly by DASH.</p><p class="muted">DASH Venmo payment information will be displayed here once officially configured.</p></div><div class="method"><h3>After You Pay</h3><p>Submit the payment method and confirmation/reference information below. DASH will independently verify that the funds were received.</p><form onsubmit="submitPayment(event)"><div class="fields"><div><label>Payment Method</label><select id="method" required><option value="">Choose…</option><option>Cash App</option><option>Venmo</option></select></div><div><label>Amount Paid</label><input id="amount" type="number" min="0.01" step="0.01" value="'+Number(invoice.amount||0)+'" required></div><div class="full"><label>Payment Reference / Confirmation</label><input id="ref" maxlength="120" placeholder="Enter the reference shown after payment" required></div></div><button type="submit">Submit Payment for Verification</button><div class="status" id="status"></div></form></div>')+'<p class="muted">Invoice #'+esc(invoice.invoice_number)+' · Due '+(invoice.due_at?new Date(invoice.due_at).toLocaleDateString():'upon receipt')+'</p>'}async function submitPayment(e){e.preventDefault();const status=document.getElementById('status');status.textContent='Submitting…';const {error}=await db.from('payments').insert({invoice_id:invoice.id,amount:Number(document.getElementById('amount').value),method:document.getElementById('method').value,payment_status:'awaiting_verification',transaction_reference:document.getElementById('ref').value});if(error){status.textContent='We could not submit the payment information. Please contact DASH.';return}status.textContent='Payment information submitted. DASH will verify receipt before confirming your appointment.';e.target.querySelector('button').disabled=true}</script></body></html>
