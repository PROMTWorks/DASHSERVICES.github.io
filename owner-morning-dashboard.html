<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DASH | Owner Morning Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f8;color:#17202a}.top{background:#111827;color:#fff;padding:20px 28px;display:flex;justify-content:space-between}.brand{font-weight:800;letter-spacing:2px}.wrap{max-width:1400px;margin:auto;padding:28px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.muted{color:#64748b;font-size:13px}.btn{background:#111827;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid #e1e6eb;border-radius:12px}.card{padding:17px}.label{font-size:11px;font-weight:800;color:#64748b}.value{font-size:26px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{margin-bottom:18px;overflow:hidden}.head{padding:16px 18px;border-bottom:1px solid #e1e6eb;font-weight:800;display:flex;justify-content:space-between}.body{padding:18px}.item{padding:12px 0;border-bottom:1px solid #e8edf2}.item:last-child{border-bottom:0}.pill{display:inline-block;background:#eef2f7;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:700}.warn{background:#fff7ed;color:#9a3412}.good{background:#ecfdf5;color:#166534}.empty{text-align:center;color:#64748b;padding:24px}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.cards{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column;gap:10px}}</style></head><body><header class="top"><div class="brand">DASH MOBILE SERVICES</div><div>OWNER DASHBOARD</div></header><main class="wrap"><div class="bar"><div><h1>Good Morning, Owner</h1><div class="muted" id="date"></div></div><button class="btn" onclick="location.href='admin-production.html'">← Admin Portal</button></div><section class="cards"><div class="card"><div class="label">TODAY'S JOBS</div><div class="value" id="jobs">—</div></div><div class="card"><div class="label">UNASSIGNED</div><div class="value" id="unassigned">—</div></div><div class="card"><div class="label">ACTIVE EMPLOYEES</div><div class="value" id="employees">—</div></div><div class="card"><div class="label">OPEN CLOCKS</div><div class="value" id="clocks">—</div></div><div class="card"><div class="label">OPEN ISSUES</div><div class="value" id="issues">—</div></div></section><div class="grid"><section class="panel"><div class="head">Today's Schedule <span class="pill" id="scheduleCount">0</span></div><div class="body" id="schedule"><div class="empty">Loading…</div></div></section><section class="panel"><div class="head">Dispatch Attention</div><div class="body" id="dispatch"><div class="empty">Loading…</div></div></section><section class="panel"><div class="head">Payroll & Time</div><div class="body" id="payroll"><div class="empty">Loading…</div></div></section><section class="panel"><div class="head">HR & Business Health</div><div class="body" id="health"><div class="empty">Loading…</div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://roywoofgypiyoobdcrwx.supabase.co','sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_');const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=new Date();const start=new Date(today.getFullYear(),today.getMonth(),today.getDate());const end=new Date(start);end.setDate(end.getDate()+1);$('date').textContent=start.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});async function load(){const [j,e,t,a]=await Promise.all([db.from('business_jobs').select('*').gte('scheduled_start',start.toISOString()).lt('scheduled_start',end.toISOString()).order('scheduled_start'),db.from('employee_profiles').select('id,full_name,employment_status').eq('employment_status','active'),db.from('employee_time_entries').select('id,employee_id,clock_in,clock_out').is('clock_out',null),db.from('job_employee_assignments').select('job_id,employee_id,status')]);let jobs=j.data||[],emps=e.data||[],clocks=t.data||[],assign=a.data||[];$('jobs').textContent=jobs.length;$('employees').textContent=emps.length;$('clocks').textContent=clocks.length;const assigned=new Set(assign.filter(x=>x.status==='assigned').map(x=>x.job_id));const unassigned=jobs.filter(x=>!assigned.has(x.id));$('unassigned').textContent=unassigned.length;$('scheduleCount').textContent=jobs.length;renderSchedule(jobs,assign,emps);renderDispatch(unassigned);renderPayroll(clocks,emps);renderHealth(emps)}function renderSchedule(jobs,assign,emps){$('schedule').innerHTML=jobs.length?jobs.map(j=>{const names=assign.filter(a=>a.job_id===j.id).map(a=>emps.find(e=>e.id===a.employee_id)?.full_name).filter(Boolean);return `<div class="item"><b>${esc(j.service_name||j.title||'Service Job')}</b><div class="muted">${j.scheduled_start?new Date(j.scheduled_start).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'Time not set'} · ${esc(j.service_location||j.address||'Location not set')}</div><span class="pill ${names.length?'good':'warn'}">${names.length?esc(names.join(', ')):'UNASSIGNED'}</span></div>`}).join(''):'<div class="empty">No jobs scheduled today.</div>'}function renderDispatch(unassigned){$('dispatch').innerHTML=unassigned.length?unassigned.map(j=>`<div class="item"><b>Unassigned job</b><div class="muted">${esc(j.service_name||j.title||'Service Job')} · ${j.scheduled_start?new Date(j.scheduled_start).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''}</div></div>`).join(''):'<div class="item"><span class="pill good">✓ All scheduled jobs assigned</span></div>'}function renderPayroll(clocks,emps){$('payroll').innerHTML=`<div class="item"><b>Employees currently clocked in</b><div class="muted">${clocks.length}</div></div><div class="item"><b>Open time entries needing attention</b><div class="muted">${clocks.length}</div></div>`}function renderHealth(emps){$('health').innerHTML=`<div class="item"><b>Active workforce</b><div class="muted">${emps.length} employee${emps.length===1?'':'s'}</div></div><div class="item"><b>Business status</b><div class="pill good">Systems online</div></div><div class="item"><b>Owner action</b><div class="muted">Review unassigned jobs and open time entries first.</div></div>`;$('issues').textContent='—'}load();</script></body></html>
