her employees.</div><button id="btn">Create My Password</button></form><div id="error" class="msg error"></div><div id="ok" class="msg ok"></div></div><script>const U='https://roywoofgypiyoobdcrwx.supabase.co',K='sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_',q=new URLSearchParams(location.search),token=q.get('token')||'',employee=(q.get('employee')||'').toUpperCase(),mode=q.get('mode')||'setup',$=x=>document.getElementById(x);$('eid').textContent=employee||'Invalid';if(mode==='reset'){$('title').textContent='Reset Your Employee Password';$('sub').textContent='Create a new private password. Your previous password will stop working after this reset is completed.';$('btn').textContent='Reset My Password'}if(!token||!/^EDS\d{4,}$/.test(employee)){$('btn').disabled=true;show('error','This setup/reset link is invalid. Ask an administrator for a new one.')}$('form').onsubmit=async e=>{e.preventDefault();$('error').style.display='none';$('ok').style.display='none';const p=$('password').value,c=$('confirm').value;if(p.length<8)return show('error','Password must be at least 8 characters.');if(p!==c)return show('error','The passwords do not match.');$('btn').disabled=true;$('btn').textContent=mode==='reset'?'Resetting Password…':'Creating Password…';try{const r=await fetch(U+'/functions/v1/employee-password-setup',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({token,employee_id:employee,password:p,mode})});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'Unable to update your password.');show('ok',mode==='reset'?'Password reset successfully. You can now sign in.':'Password created successfully. You can now sign in.');setTimeout(()=>location.replace('employee-login.html'),1200)}catch(err){show('error',err.message||'Unable to update your password.');$('btn').disabled=false;$('btn').textContent=mode==='reset'?'Reset My Password':'Create My Password'}};function show(id,t){$(id).textContent=t;$(id).style.display='block'}</sc
