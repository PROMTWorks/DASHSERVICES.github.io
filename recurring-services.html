<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DASH | Recurring Services</title><style>body{font-family:Arial;margin:0;background:#f3f5f8;color:#17202a}.wrap{max-width:1200px;margin:auto;padding:28px}.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin-bottom:18px}h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px;border:1px solid #ccd4de;border-radius:7px}.btn{background:#111827;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer}.item{border:1px solid #ddd;border-radius:9px;padding:14px;margin:10px 0}.muted{color:#64748b;font-size:13px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p><a href="admin-production.html">← Admin Portal</a></p><h1>Recurring Services</h1><p class="muted">Keep repeat customers scheduled without rebuilding the same booking every time.</p><div class="grid"><div class="panel"><h2>Create Recurring Service</h2><label>Customer</label><select id="customer"></select><label>Service</label><input id="service" placeholder="Lawn & Property Care"><label>Service location</label><input id="location"><label>Frequency</label><select id="frequency"><option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option></select><label>First service date/time</label><input id="next" type="datetime-local"><label>Default price</label><input id="price" type="number" min="0" step="0.01"><label>Customer instructions</label><textarea id="instructions"></textarea><button class="btn" id="save">Save Recurring Service</button></div><div class="panel"><h2>Active Recurring Customers</h2><div id="list">Loading…</div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://roywoofgypiyoobdcrwx.supabase.co','sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>'$'+Number(v||0).toFixed(2);async function load(){let c=await db.from('customers').select('id,name').eq('active',true).order('name');if(c.error){$('list').textContent=c.error.message;return}$('customer').innerHTML=(c.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');let r=await db.from('recurring_services').select('*,customers(name)').eq('active',true).order('next_service_at');$('list').innerHTML=r.data?.length?r.data.map(x=>'<div class="item"><b>'+esc(x.customers?.name||'Customer')+'</b><br>'+esc(x.service_name)+' · '+esc(x.frequency)+'<br><span class="muted">Next: '+new Date(x.next_service_at).toLocaleString()+' · '+money(x.default_revenue)+'</span></div>').join(''):'<p class="muted">No recurring services yet.</p>'}$('save').onclick=async()=>{let n=$('next').value;if(!n){alert('Choose the first service date/time.');return}let r=await db.from('recurring_services').insert({customer_id:$('customer').value,service_name:$('service').value.trim(),service_location:$('location').value.trim()||null,frequency:$('frequency').value,next_service_at:new Date(n).toISOString(),default_revenue:Number($('price').value||0),customer_instructions:$('instructions').value.trim()||null});if(r.error){alert(r.error.message);return}alert('Recurring service saved.');load()};load()</script></body></html>
