<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DASH MOBILE SERVICES | Training Sign-Offs</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f5f8;color:#17202a}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:27px}.muted{color:#64748b;font-size:13px}.panel{background:#fff;border:1px solid #e2e7ed;border-radius:12px;overflow:hidden;margin-bottom:18px}.head{padding:18px 20px;border-bottom:1px solid #e2e7ed}.body{padding:20px}.row{border:1px solid #e2e7ed;border-radius:10px;padding:15px;margin-bottom:10px}.rowtop{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:11px;padding:5px 9px;border-radius:20px;background:#f1f5f9;font-weight:800}.ok{color:#166534}.warn{color:#92400e}.bad{color:#991b1b}.btn{border:0;border-radius:8px;padding:9px 12px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.btn.light{background:#fff;color:#17202a;border:1px solid #d7dde5}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.error{display:none;background:#fef2f2;color:#991b1b;padding:12px;border-radius:8px;margin-bottom:15px}.show{display:block}.empty{text-align:center;padding:30px;color:#64748b}@media(max-width:700px){.top,.rowtop{flex-direction:column;align-items:flex-start}}</style></head><body><main class="wrap"><div class="top"><div><h1>DASH MOBILE SERVICES — Training Sign-Offs</h1><div class="muted">Owner-only required checkpoints before and after the Master Test</div></div><button class="btn light" onclick="location.href='owner-training-management.html'">Training Management</button></div><div id="error" class="error"></div><section class="panel"><div class="head"><strong>Required Owner Checkpoints</strong></div><div class="body"><div class="muted" style="margin-bottom:15px">Employees cannot advance through the training workflow until the required Owner checkpoint is approved.</div><div id="rows">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://roywoofgypiyoobdcrwx.supabase.co',K='sb_publishable_5SKEbO1wFS4LVZ6IcpWfnA_UQffaKX_',c=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[x]));let rows=[];function label(s){return s==='PRE_MASTER'?'Owner Sign-Off #1 — Training Review':'Owner Sign-Off #2 — Final Training Approval'}function card(r){const s=String(r.status||'PENDING').toUpperCase(),cls=s==='APPROVED'?'ok':s==='RETRAINING_REQUIRED'?'bad':'warn';return '<div class="row"><div class="rowtop"><div><strong>'+esc(r.employee_name||r.employee_number||r.employee_id)+'</strong><div class="muted">'+label(r.signoff_stage)+'</div></div><span class="pill '+cls+'">'+esc(s)+'</span></div>'+(r.signed_at?'<div class="muted" style="margin-top:8px">Updated: '+esc(new Date(r.signed_at).toLocaleString())+'</div>':'')+(r.notes?'<div class="muted" style="margin-top:8px">Owner note: '+esc(r.notes)+'</div>':'')+'<div class="actions"><button class="btn" onclick="act(\''+r.employee_id+'\',\''+r.signoff_stage+'\',\'approve\')">Approve Sign-Off</button><button class="btn light" onclick="act(\''+r.employee_id+'\',\''+r.signoff_stage+'\',\'retraining\')">Require Retraining</button></div></div>'}async function init(){try{const{data:{session},error}=await c.auth.getSession();if(error||!session){location.replace('admin-entry.html');return}const{data:role,error:re}=await c.rpc('current_employee_role');if(re)throw re;if(String(role||'').toLowerCase()!=='owner'){await c.auth.signOut();location.replace('admin-entry.html');return}await load();setInterval(load,5000)}catch(e){$('error').textContent=e.message||'Unable to load sign-offs.';$('error').classList.add('show')}}async function load(){const{data,error}=await c.rpc('owner_get_employee_training_signoffs');if(error)throw error;rows=data||[];render()}function render(){const by={};rows.forEach(r=>{(by[r.employee_id]||(by[r.employee_id]=[])).push(r)});const out=[];Object.keys(by).forEach(id=>{const rs=by[id];['PRE_MASTER','FINAL'].forEach(stage=>{const r=rs.find(x=>x.signoff_stage===stage);if(r)out.push(card(r));else out.push('<div class="row"><strong>'+esc(rs[0].employee_name||id)+'</strong><div class="muted">'+label(stage)+'</div><div class="actions"><button class="btn" onclick="act(\''+id+'\',\''+stage+'\',\'approve\')">Approve Sign-Off</button><button class="btn light" onclick="act(\''+id+'\',\''+stage+'\',\'retraining\')">Require Retraining</button></div></div>')})});$('rows').innerHTML=out.length?out.join(''):'<div class="empty">No employee training sign-off records are currently available.</div>'}async function act(employeeId,stage,action){const notes=prompt(action==='approve'?'Optional Owner sign-off note:':'Reason for requiring retraining:','');if(notes===null)return;const{error}=await c.rpc('owner_set_employee_training_signoff',{p_employee_id:employeeId,p_signoff_stage:stage,p_action:action,p_notes:notes||null});if(error){alert(error.message||'Unable to update sign-off.');return}await load()}init();</script></body></html>
